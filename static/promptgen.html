</style></head><body><div class="app-shell">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">JT</span><span>JT 灵感工作台</span></a><nav class="topnav"><a class="topnav-link active" href="/">创作台</a><a class="topnav-link" href="/realism">真人化</a><a class="topnav-link" href="/video">视频</a></nav><div class="topbar-tools"><span class="connection-dot" title="服务在线"></span><button class="topbar-action" id="favOpen">♥ 收藏</button><button class="topbar-action" id="histOpen">⌛ 历史</button></div></header>

<aside class="creation-pane"><div class="creation-scroll"><div class="pane-heading"><div><span class="eyebrow">AI CREATION</span><h1>创作设置</h1></div></div>
<span class="section-label">画风</span><section class="switch" id="styleSwitch"><button data-style="cold">冷脸萌</button><button data-style="sketch">铅绘</button><button data-style="original_sketch">原始铅绘</button><button data-style="graphic">古风</button><button data-style="original_graphic">原始古风</button><button data-style="hanmanga">古漫</button><button data-style="nff">NFF</button></section>
<div id="coldVariantSwitch"><span class="section-label">冷脸萌分支</span><section class="switch"><button data-style-variant="character_bound">人物+画风</button><button data-style-variant="style_only">仅画风候选</button></section><div class="note" id="coldVariantNote">现有双 LoRA 兼容分支</div></div>
<span class="section-label">人物模式</span><section class="switch" id="modeSwitch"><button data-mode="original">原创人物</button><button data-mode="character">角色模式</button></section>
<div id="drawers"></div><div class="actions"><button class="primary" id="randomAll">随机选项</button><button class="primary" id="clearAll">全部清空</button></div>
<span class="section-label">提示词</span><section class="switch" id="promptModePanel"><label><input type="radio" name="promptModeRadio" value="options" checked> 选项组合</label><label><input type="radio" name="promptModeRadio" value="manual"> 手动提示词</label><select id="promptMode" style="display:none"><option value="options">选项组合</option><option value="manual">手动提示词</option></select></section><button class="dl" id="importGeneratedPrompt" type="button">导入并编辑</button>

<section class="prompt" id="promptPanel"><div class="prompt-head"><b>详细提示词</b><div class="prompt-actions-inline"><button class="dl" id="copyPrompt">复制</button><button class="dl" id="promptToggle">展开</button></div></div><div class="prompt-body"><textarea id="promptText"></textarea></div></section>
<span class="section-label">生成参数</span><section class="settings"><label>宽<input id="genW" type="number" value="768" min="256" max="2048" step="16"></label><label>高<input id="genH" type="number" value="1024" min="256" max="2048" step="16"></label><label>批量<input id="genBatch" type="number" value="1" min="1" max="4"><span id="batchNote" style="display:none"></span></label><label>高清<select id="genHd"><option value="0">关闭</option><option value="1">ClearReality 2×</option><option value="2">UltraSharp 2×</option></select></label><label>种子模式<select id="seedMode"><option value="random">每次随机</option><option value="fixed">固定</option></select></label><label>种子值<input id="genSeed" type="number" min="1" max="9007199254740991" step="1"></label></section>
</div><div class="creation-footer"><div class="generation-actions"><button class="primary generate liquid-button cloud" id="genCloudBtn"><span class="liquid-fill" aria-hidden="true"><span class="liquid-meniscus"></span><span class="liquid-specular"></span></span><span class="liquid-label liquid-label-base">☁ 云端生图 <span class="liquid-percent">0%</span></span><span class="liquid-label liquid-label-fill" aria-hidden="true">☁ 云端生图 <span class="liquid-percent">0%</span></span></button><button class="primary generate liquid-button local" id="genLocalBtn"><span class="liquid-fill" aria-hidden="true"><span class="liquid-meniscus"></span><span class="liquid-specular"></span></span><span class="liquid-label liquid-label-base">本地生成 <span class="liquid-percent">0%</span></span><span class="liquid-label liquid-label-fill" aria-hidden="true">本地生成 <span class="liquid-percent">0%</span></span></button></div></div></aside>
<section class="preview-pane"><div class="preview-header"><h2>创作预览</h2><div class="result-tabs"><button class="result-tab active" data-result-tab="cloud">云端结果</button><button class="result-tab" data-result-tab="local">本地结果</button></div></div><div class="preview-stage"><div class="preview-empty" id="previewEmpty"><img class="preview-example" id="stylePreview" alt="当前画风效果预览"><span class="preview-caption" id="stylePreviewCaption"></span></div><section class="result-panel active" data-result-panel="cloud"><div class="status" id="genCloudStatus"></div><div class="result" id="genCloudResult"></div></section><section class="result-panel" data-result-panel="local"><div class="status" id="genLocalStatus"></div><div class="result" id="genLocalResult"></div></section></div></section>

function addResult(j,container){container.innerHTML='';if((j.images||[]).length){previewEmpty.classList.add('hidden');document.querySelector('.preview-stage').classList.add('has-results')}setResultTab(j.generation_backend==='local'?'local':'cloud');(j.images||[]).forEach((im,i)=>{const w=document.createElement('div');w.className='job';w.innerHTML=`${im.stage_label?`<b>${im.stage_label}</b>`:''}<div class="note">${j.generation_backend==='local'?'本地':'云端'} · ${creatorCoinText(j)} · 种子：${j.seed??j.sequence_seed??'未知'} · ${j.prompt_mode==='manual'?'手动Prompt':'选项组合'}</div><img loading="lazy" decoding="async" src="${im.preview_url||im.url}"><button class="dl fav">♥ 收藏图片、提示词和种子</button><a class="dl" target="_blank" href="${im.url}">⬇ 下载原图</a>`;w.querySelector('.fav').onclick=async e=>{e.target.disabled=true;e.target.textContent='收藏中…';try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:j.id,image_index:i})});e.target.textContent='✓ 已收藏'}catch(x){e.target.disabled=false;e.target.textContent='收藏失败：'+x.message}};container.appendChild(w)})}
async function resumeActiveJob(backend){const jobId=sessionStorage.getItem(activeJobKey(backend));if(!jobId)return;const button=backend==='local'?genLocalBtn:genCloudBtn,status=backend==='local'?genLocalStatus:genCloudStatus,result=backend==='local'?genLocalResult:genCloudResult;try{let j=await api('/api/job/'+jobId);if(j.status==='done'){forgetActiveJob(backend);addResult(j,result);status.textContent='✓ 已恢复完成任务（'+j.elapsed+'秒）';return}if(j.status==='error'){forgetActiveJob(backend);status.textContent='✗ '+(j.error||'任务失败');return}genRunning[backend]=true;button.disabled=true;setLiquidLoading(button,true);setLiquidProgress(button,Number(j.progress_pct)||0);status.textContent='正在恢复任务 '+Math.round(Number(j.progress_pct)||0)+'%';j=await pollJobResilient(jobId,next=>{if(!next)return;setLiquidProgress(button,Number(next.progress_pct)||0);status.textContent=(next.provider_status||next.status)+' '+Math.round(Number(next.progress_pct)||0)+'%'});forgetActiveJob(backend);if(j.status==='done'){setLiquidProgress(button,100);addResult(j,result);await waitLiquidSettled(button,100);status.textContent='✓ 完成（'+j.elapsed+'秒）'}else status.textContent='✗ '+(j.error||'任务失败')}catch(e){status.textContent='任务恢复暂时失败：'+e.message}finally{genRunning[backend]=false;setLiquidLoading(button,false);button.disabled=false}}async function resumeActiveJobs(){await Promise.all(['cloud','local'].map(resumeActiveJob))}
async function generate(backend){if(genRunning[backend])return;genRunning[backend]=true;const button=backend==='local'?genLocalBtn:genCloudBtn;const status=backend==='local'?genLocalStatus:genCloudStatus;const result=backend==='local'?genLocalResult:genCloudResult;let lastProgress=0,terminal=false;button.disabled=true;setLiquidLoading(button,true);setLiquidProgress(button,3);status.textContent='正在提交…';result.innerHTML='';try{const sequence_mode='off';if(seedMode.value==='random')genSeed.value=newRandomSeed();const seed=+genSeed.value;const positive=promptMode.value==='manual'?manualPositive.value.trim():buildCorePrompt();const negative=promptMode.value==='manual'?manualNegative.value.trim():cfg().negative;if(!positive)throw new Error('正向提示词不能为空');const client_request_id=backend+'-'+Date.now()+'-'+Math.random().toString(36).slice(2);const body={workflow:'anima02',prompt:positive,negative_prompt:negative,prompt_mode:promptMode.value,width:+genW.value,height:+genH.value,batch:+genBatch.value,hd:+genHd.value,seed:seed,seed_mode:seedMode.value,style_id:currentStyle,style_variant:currentStyleVariant(),mode:currentMode,sequence_mode,generation_backend:backend,client_request_id,selection_snapshot:{...snapshotSelections(),generation_backend:backend}};const r=await submitGenerateResilient(body);rememberActiveJob(backend,r.job_id);const j=await pollJobResilient(r.job_id,(next,broken,retry)=>{if(broken){status.textContent='轮询连接暂时中断，正在重试（'+retry+'/6）';return}lastProgress=Math.max(lastProgress,Number(next.progress_pct)||0);setLiquidProgress(button,lastProgress);const stage=(next.stage_status||[]).find(x=>x.status==='RUNNING');const phase=next.provider_status==='RESULT_TRANSFERRING'||next.provider_status==='RESULT_DOWNLOADING'?'正在取回结果 '+(next.transfer_index||0)+'/'+(next.transfer_total||0):(stage?.stage_label||next.provider_status||next.status);status.textContent=phase+' '+Math.round(lastProgress)+'%'});terminal=true;forgetActiveJob(backend);if(j.status==='error')throw new Error(j.error||'生成失败');setLiquidProgress(button,100);addResult(j,result);await waitLiquidSettled(button,100);status.textContent='✓ 完成（'+j.elapsed+'秒，种子 '+j.seed+'）';await new Promise(x=>setTimeout(x,420))}catch(e){status.textContent='✗ '+e.message;if(terminal)forgetActiveJob(backend)}finally{genRunning[backend]=false;setLiquidLoading(button,false);button.disabled=false}}
async function history(){histList.innerHTML='加载中…';try{const a=await api('/api/jobs?scope=creator');histList.innerHTML='';a.slice(0,10).forEach(j=>{const d=document.createElement('div');d.className='job';const variant=j.style_id==='cold'?(j.style_variant==='style_only'?'仅画风候选':'人物+画风'):'';d.innerHTML=`<b>${STYLE_CONFIGS[j.style_id]?.short||'历史'}${variant?' · '+variant:''} · ${j.generation_backend==='local'?'本地':'云端'} · ${j.mode==='character'?'角色':'原创'}</b><div class="note">${j.status} · ${creatorCoinText(j)} · ${j.width}×${j.height} · ${j.batch}张 · 种子 ${j.seed??j.sequence_seed??'未知'} · ${j.elapsed||''}秒</div><button class="dl">查看图片</button>`;d.querySelector('button').onclick=()=>addResult(j,d);histList.appendChild(d)})}catch(e){histList.innerHTML=`<div class="job"><b>历史加载失败</b><div class="note">${e.message}</div></div>`}}
async function favorites(){favList.innerHTML='加载中…';try{const a=await api('/api/favorites');favList.innerHTML='';a.forEach(f=>{const d=document.createElement('div');d.className='job';d.innerHTML=`<div class="note">种子：${f.seed??f.selection_snapshot?.seed??'未知'} · ${f.prompt_mode==='manual'?'手动Prompt':'选项组合'}</div><img src="${f.preview_url||f.image_url}"><button class="dl apply">↺ 套用提示词、选项和种子</button><button class="dl copy">复制完整提示词</button><a class="dl" href="${f.image_url}" target="_blank">⬇ 下载收藏原图</a>`;d.querySelector('.apply').onclick=()=>{applySnapshot(f.selection_snapshot);favOverlay.classList.remove('open')};d.querySelector('.copy').onclick=()=>navigator.clipboard.writeText(f.prompt||'');favList.appendChild(d)})}catch(e){favList.innerHTML=`<div class="job"><b>收藏加载失败</b><div class="note">${e.message}</div></div>`}}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{currentStyle=b.dataset.style;currentMode=cfg().defaultMode||'original';prepareStyle(currentStyle);openDrawers.clear();updateBatchSemantics();render()});document.querySelectorAll('[data-style-variant]').forEach(b=>b.onclick=()=>{setStyleVariant(b.dataset.styleVariant);render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{currentMode=b.dataset.mode;openDrawers.clear();render()});document.querySelectorAll('input[name="promptModeRadio"]').forEach(x=>x.onchange=()=>{promptMode.value=x.value;updatePromptModeUI()});importGeneratedPrompt.onclick=importGeneratedPromptToManual;document.querySelectorAll('[data-result-tab]').forEach(x=>x.onclick=()=>setResultTab(x.dataset.resultTab));seedMode.onchange=()=>{if(seedMode.value==='random')genSeed.value=newRandomSeed()};document.getElementById('randomAll').onclick=randomAll;document.getElementById('clearAll').onclick=setNone;genCloudBtn.onclick=()=>generate('cloud');genLocalBtn.onclick=()=>generate('local');document.getElementById('copyPrompt').onclick=()=>navigator.clipboard.writeText(buildAll());document.getElementById('promptToggle').onclick=()=>promptPanel.classList.toggle('open');document.getElementById('histOpen').onclick=()=>{histOverlay.querySelector('.library-scroll').scrollTop=0;histOverlay.classList.add('open');history()};document.getElementById('favOpen').onclick=()=>{favOverlay.querySelector('.library-scroll').scrollTop=0;favOverlay.classList.add('open');favorites()};document.querySelectorAll('.library-overlay .close').forEach(b=>b.onclick=()=>b.closest('.library-overlay').classList.remove('open'));document.querySelectorAll('.library-overlay').forEach(x=>x.onclick=e=>{if(e.target===x)x.classList.remove('open')});const styleParam=new URLSearchParams(location.search).get('style');if(styleParam&&STYLE_CONFIGS[styleParam])currentStyle=styleParam;genSeed.value=newRandomSeed();prepareStyle(currentStyle);updatePromptModeUI();updateBatchSemantics();setResultTab('cloud');render();scheduleRoutePrefetch();resumeActiveJobs();</script></body></html>
