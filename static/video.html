<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JT 视频工作台</title><style>
:root{--brand:#536cff;--brand-dark:#4057e8;--canvas:#f6f7fb;--surface:#ffffff;--surface-soft:#fafbfe;--text:#20222a;--muted:#8b8f9a;--border:#e7e9f0;--shadow:0 14px 40px rgba(36,42,68,.08)}*{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;background:var(--canvas);color:var(--text);height:100vh;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.app-shell{height:100vh;overflow:hidden}.topbar{height:68px;display:flex;align-items:center;gap:28px;padding:0 28px;background:#fff;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:900;text-decoration:none;white-space:nowrap}.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:13px}.topnav{display:flex;gap:6px;overflow-x:auto}.topnav-link{height:38px;display:flex;align-items:center;padding:0 13px;border-radius:10px;color:#707482;text-decoration:none;font-size:13px;font-weight:760;white-space:nowrap}.topnav-link.active{background:#eef1ff;color:var(--brand)}.topbar-tools{margin-left:auto;display:flex;gap:8px}.topbar-action{height:38px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:0 13px;color:#565b69;font-weight:760}.studio-grid{display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);gap:22px;max-width:1540px;height:calc(100vh - 68px);margin:auto;padding:22px 24px 20px;min-height:0}.creation-pane{display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.creation-scroll{flex:1;min-height:0;overflow:auto;padding:18px}.creation-footer{padding:12px 18px 18px;border-top:1px solid var(--border)}.pane-heading h1{font-size:22px;margin:0 0 14px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px}.switch{padding:8px;display:block;background:#f5f6fa}.workflow-section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-bottom:9px}.workflow-section:last-child{margin-bottom:0}.workflow-section-title{grid-column:1/-1;padding:4px 5px 2px;color:#858a98;font-size:10px;font-weight:900;letter-spacing:.08em}.switch button{min-width:0;border:0;border-radius:10px;padding:10px;background:transparent;color:#656b78;font-weight:800}.switch button.active{background:#fff;color:var(--brand);box-shadow:0 3px 12px rgba(35,40,60,.08)}.form{padding:14px;margin-top:10px}.form label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:11px 0 5px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px}.form textarea{min-height:90px}.drop{border:2px dashed var(--border);border-radius:11px;padding:15px;text-align:center;color:var(--muted);background:#fafbfe}.drop .fn{font-weight:800;color:#5f6e8e;word-break:break-all}.primary{position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:850}.primary span{position:relative;z-index:2}.video-wave{position:absolute;z-index:1;left:-10%;bottom:-2px;width:120%;height:130%;background:#536cff;transform:translateY(108%);transition:transform 25s cubic-bezier(.16,.72,.23,1)}.video-wave::before{content:"";position:absolute;left:50%;top:-18px;width:180%;height:38px;border-radius:43%;transform:translateX(-50%);background:rgba(255,255,255,.3);animation:wave 7s linear infinite}.primary.is-loading .video-wave{transform:translateY(5%)}@keyframes wave{to{transform:translateX(-50%) rotate(360deg)}}.status{font-size:12px;color:#677080;margin-top:8px}.preview-pane{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}.preview-header{display:flex;justify-content:space-between;align-items:center}.preview-header h2{margin:0;font-size:18px}.preview-stage{position:relative;flex:1;min-height:0;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,#fbfbfd,#f0f2f7);overflow:auto;padding:16px;box-shadow:var(--shadow)}.preview-empty{position:absolute;inset:72px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a1a5af;pointer-events:none}.preview-empty.hidden{display:none}.preview-empty strong{color:#676c78;font-size:16px;margin:8px 0 6px}.preview-empty span{font-size:12px}.empty-icon{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:#e9ebf2;color:#9da2af;font-size:28px}.config-loading,.config-error{width:100%;padding:14px;border-radius:10px;background:#f5f6fa;color:#737987;font-size:12px;line-height:1.6}.config-error{border:1px solid #ead9d5;background:#fff9f7;color:#815d55}.config-error b,.config-error span{display:block}.config-error button{min-height:44px;margin-top:10px;border:1px solid #d9c0b9;border-radius:9px;background:#fff;padding:0 16px;color:#754f46;font-weight:800}.task-panel-head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}.task-card,.job{border:1px solid var(--border);border-radius:12px;background:#fff;margin:10px 0;padding:12px}.task-spin{width:30px;height:30px;border:4px solid #dbe1f0;border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}.task-spin.done{border-color:#7db69f;animation:none}.task-spin.err{border-color:#d58c80;animation:none}@keyframes spin{to{transform:rotate(360deg)}}.task-info{display:inline-block;margin-left:10px}.task-time{float:right;font-weight:850}.task-result img,.task-result video,.result img,.result video,.job img{width:100%;max-height:640px;object-fit:contain;border-radius:10px;background:#111}.file-result{min-height:96px;margin-top:9px;border:1px dashed var(--border);border-radius:10px;display:grid;place-items:center;background:#fafbfe;color:#747986;font-weight:800}.dl{display:block;width:100%;border:0;text-align:center;margin-top:7px;padding:9px;border-radius:9px;background:#f0f2f8;color:#5d6474;font-weight:750;text-decoration:none}.library-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(25,28,38,.28);padding:74px 20px 20px}.library-overlay.open{display:flex;justify-content:flex-end}.library-panel{width:min(460px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:20px}.library-header{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--border)}.library-header h2{margin:0}.library-scroll{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}.close{width:36px;height:36px;border:0;border-radius:10px}.note,.task-meta{font-size:11px;color:var(--muted)}
.media-gallery{display:grid;grid-template-rows:minmax(280px,1fr) auto;gap:10px;min-height:0}.gallery-main{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:14px;background:#111;overflow:hidden}.gallery-main img,.gallery-main video{display:block;max-width:100%;width:auto;max-height:56vh;object-fit:contain}.gallery-meta{align-self:stretch;padding:9px 12px;color:#d8dbe4;background:#202127;font-size:11px}.gallery-actions{align-self:stretch;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#fff}.gallery-strip{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}.gallery-nav,.gallery-thumb,.task-view{min-height:44px;border:1px solid var(--border);border-radius:9px;background:#fff;color:#606678}.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px;scrollbar-width:thin}.gallery-thumb{flex:0 0 72px;height:64px;padding:3px;scroll-snap-align:center;overflow:hidden}.gallery-thumb.active{border:2px solid var(--brand)}.gallery-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px}.gallery-thumb span{display:grid;place-items:center;height:100%;font-weight:900}.task-view{margin-left:10px;padding:0 10px}.task-card{display:flex;align-items:center;gap:8px}.task-time{margin-left:auto;float:none}
[hidden]{display:none!important}.preview-empty{position:relative;inset:auto;min-height:min(520px,calc(100vh - 240px))}.drop.has-file{border-style:solid;border-color:#8fbf9f}.drop.is-dragging{border-color:var(--brand);background:#eef1ff}.drop:focus-visible,.gallery-nav:focus-visible,.gallery-thumb:focus-visible,.task-view:focus-visible{outline:3px solid rgba(83,108,255,.3);outline-offset:2px}
@media(max-width:820px){body{height:auto;overflow:auto}.app-shell{height:auto}.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 12px}.topnav{order:3;width:100%}.topbar-tools{margin-left:auto}.topbar-action{min-width:44px;min-height:44px}.studio-grid{grid-template-columns:1fr;height:auto;padding:12px}.creation-scroll{overflow:visible;padding:14px 14px 80px}.creation-footer{position:sticky;bottom:0;background:#fff;z-index:5}.switch button,.form input:not([type=checkbox]),.form select,.form textarea,.dl{min-height:44px}.form input[type=checkbox]{width:24px;height:24px}.preview-stage{min-height:430px}.gallery-main img,.gallery-main video{max-height:62vh}.library-overlay{padding:62px 8px 8px}}

</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">JT</span><span>JT 灵感工作台</span></a><nav class="topnav"><a class="topnav-link" href="/">创作台</a><a class="topnav-link" href="/realism">真人化</a><a class="topnav-link active" href="/video">视频</a></nav><div class="topbar-tools"><button class="topbar-action" id="favOpen">♥ 收藏</button><button class="topbar-action" id="histOpen">⌛ 历史</button></div></header><main class="studio-grid"><aside class="creation-pane"><div class="creation-scroll"><div class="pane-heading"><h1>视频创作</h1></div><section class="panel switch" id="wfSwitch"><div class="config-loading">正在加载视频工作流…</div></section><section class="panel form" id="wfForm"><div class="config-loading">加载完成后可设置提示词和素材</div></section></div><div class="creation-footer"><button class="primary" id="genBtn" disabled><span class="video-wave"></span><span>生成视频</span></button><div class="status" id="genStatus"></div></div></aside><section class="preview-pane"><div class="preview-header"><h2>视频预览</h2></div><div class="preview-stage"><div class="preview-empty" id="videoEmpty"><div class="empty-icon">▶</div><strong>生成后，视频将在这里播放</strong><span>任务状态、预览和下载会显示在同一区域</span></div><section class="media-gallery" id="mediaGallery" hidden><div class="gallery-main" id="galleryMain"></div><div class="gallery-strip"><button class="gallery-nav" id="galleryPrev" type="button" aria-label="上一个结果">←</button><div class="gallery-thumbs" id="galleryThumbs"></div><button class="gallery-nav" id="galleryNext" type="button" aria-label="下一个结果">→</button></div></section><section class="panel" id="taskPanel"><div class="task-panel-head"><b>视频任务</b><span class="note" id="taskCount">0 个任务</span></div><div id="taskList"></div></section><div class="result" id="genResult"></div></div></section></main><div class="library-overlay" id="histOverlay"><div class="library-panel"><div class="library-header"><h2>历史记录</h2><button class="close">×</button></div><div class="library-scroll"><div id="histList"></div></div></div></div><div class="library-overlay" id="favOverlay"><div class="library-panel"><div class="library-header"><h2>我的收藏</h2><button class="close">×</button></div><div class="library-scroll"><div id="favList"></div></div></div></div></div><script>const api=async(path,opt={})=>{const r=await fetch(path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok){const error=new Error(d.error||('HTTP '+r.status));error.data=d;error.status=r.status;throw error}return d};
let WFS=[],cur=null,genRunning=false,renderVersion=0;const pendingVideoSubmitKey='jt-pending-video-submit',mediaStateByWorkflow=new Map();
function ensureMediaState(workflowId){if(!mediaStateByWorkflow.has(workflowId))mediaStateByWorkflow.set(workflowId,{tokens:{},names:{},uploadIds:{}});return mediaStateByWorkflow.get(workflowId)}
function selectVideoWorkflow(workflow){cur=workflow;renderVersion++;renderForm();renderSwitch()}
async function recoverTasks(){let a=[];try{a=await api('/api/jobs?scope=video')}catch{return}a.filter(j=>j&&(j.status==='running'||j.status==='recovering')).forEach(j=>{const jobId=String(j.id||'');if(!jobId||tasks.has(jobId))return;const wf=WFS.find(w=>w.id===j.workflow),wfName=(wf&&wf.name)||j.wf_name||'视频任务';addTaskCard(jobId,wfName);pollTask(jobId)})}
async function init(){const box=document.getElementById('wfSwitch'),form=document.getElementById('wfForm'),btn=document.getElementById('genBtn');box.innerHTML='<div class="config-loading">正在加载视频工作流…</div>';form.innerHTML='<div class="config-loading">加载完成后可设置提示词和素材</div>';btn.disabled=true;try{const a=await api('/api/workflows');WFS=a.filter(w=>w.kind==='video');if(!WFS.length)throw new Error('没有可用的视频工作流');box.replaceChildren();const grouped={};WFS.forEach(w=>(grouped[w.section||'其他']??=[]).push(w));Object.entries(grouped).forEach(([section,items])=>{const group=document.createElement('div'),heading=document.createElement('div');group.className='workflow-section';heading.className='workflow-section-title';heading.textContent=section;group.appendChild(heading);items.forEach(w=>{const b=document.createElement('button'),name=document.createElement('b');b.type='button';b.dataset.wf=w.id;name.textContent=w.name;b.appendChild(name);b.onclick=()=>selectVideoWorkflow(w);group.appendChild(b)});box.appendChild(group)});selectVideoWorkflow(WFS[0]);btn.disabled=false}catch(e){cur=null;box.innerHTML='<div class="config-error"><b>视频配置加载失败</b><span></span><button type="button">重新加载</button></div>';box.querySelector('span').textContent=e.message;box.querySelector('button').onclick=retryWorkflows;form.innerHTML='<div class="config-error"><span>请确认服务连接后重试，现有任务和素材不会被提交。</span></div>'}}function retryWorkflows(){init()}
function renderSwitch(){document.querySelectorAll('#wfSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.wf===cur.id))}
function isVideoType(t){return t==='video'}
function paramDefault(key,p){return Object.prototype.hasOwnProperty.call(p,'default')?p.default:(cur.params_defaults||{})[key]}
function optionValue(option){return typeof option==='object'?String(option.value??option.name??''):String(option)}
function optionLabel(option){return typeof option==='object'?String(option.label??option.name??option.value??''):String(option)}
function renderForm(){const f=document.getElementById('wfForm'),workflow=cur,version=renderVersion,state=ensureMediaState(workflow.id);f.replaceChildren();const intro=document.createElement('div'),title=document.createElement('b'),desc=document.createElement('span');intro.className='note';title.textContent=workflow.name;desc.textContent=workflow.desc;intro.append(title,document.createElement('br'),desc);f.appendChild(intro);
  const media=Object.entries(workflow.rh_media||{});
  media.forEach(([key,m])=>{const lab=document.createElement('label');lab.textContent=m.label+(m.required?'（必传）':'（可选）');f.appendChild(lab);
    const drop=document.createElement('div'),copy=document.createElement('span'),fn=document.createElement('div'),inp=document.createElement('input');drop.className='drop';drop.tabIndex=0;drop.setAttribute('role','button');drop.setAttribute('aria-label','选择或拖入'+String(m.label||'素材'));drop.dataset.mediaKey=key;copy.textContent='点击选择或拖入文件';fn.className='fn';fn.setAttribute('aria-live','polite');inp.type='file';inp.hidden=true;inp.accept=isVideoType(m.type)?'video/*':'image/*';drop.append(copy,fn,inp);if(state.tokens[key]){drop.classList.add('has-file');fn.textContent='✓ '+state.names[key]+' 已上传'}const accept=file=>{if(file)uploadMedia(key,m,file,drop,workflow,version,state)};drop.onclick=event=>{if(event.target!==inp)inp.click()};drop.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();inp.click()}};drop.ondragover=event=>{event.preventDefault();drop.classList.add('is-dragging')};drop.ondragleave=()=>drop.classList.remove('is-dragging');drop.ondrop=event=>{event.preventDefault();drop.classList.remove('is-dragging');accept(event.dataTransfer?.files?.[0])};inp.onchange=()=>accept(inp.files[0]);
    f.appendChild(drop)});
  const params=Object.entries(cur.rh_params||{});
  params.forEach(([key,p])=>{const lab=document.createElement('label');lab.textContent=p.label+(p.required?'（必填）':'');f.appendChild(lab);let inp;
    if(p.type==='text'||p.type==='textarea'||key==='prompt'||key==='negative'){inp=document.createElement('textarea');if(cur.prompt_placeholder&&key==='prompt')inp.placeholder=cur.prompt_placeholder;if(key==='prompt'&&cur.prompt_hint){const h=document.createElement('div');h.className='note';h.style.color='#c26a4a';h.textContent=cur.prompt_hint;f.appendChild(h)}}
    else if(p.type==='boolean'){inp=document.createElement('input');inp.type='checkbox'}
    else if(p.type==='select'){inp=document.createElement('select');(p.options||[]).forEach(option=>{const item=document.createElement('option');item.value=optionValue(option);item.textContent=optionLabel(option);inp.appendChild(item)})}
    else{inp=document.createElement('input');inp.type=(p.type==='number'||p.type==='int'||p.vtype==='int'||p.vtype==='float')?'number':'text';if(p.min!==undefined)inp.min=p.min;if(p.max!==undefined)inp.max=p.max;if(p.step!==undefined)inp.step=p.step;else if(p.type==='int'||p.vtype==='int')inp.step='1'}
    inp.id='param_'+key;inp.dataset.paramType=p.vtype||p.type||'text';const d=paramDefault(key,p);if(d!==undefined){if(inp.type==='checkbox')inp.checked=d===true;else inp.value=d}f.appendChild(inp)});
  (cur.fixed_features||[]).forEach(text=>{const note=document.createElement('div');note.className='note unavailable';note.textContent=text;f.appendChild(note)})}
async function uploadMedia(key,m,file,drop,workflow,version,state){const fnEl=drop.querySelector('.fn'),uploadId=(state.uploadIds[key]||0)+1;state.uploadIds[key]=uploadId;fnEl.textContent='上传中…';drop.classList.remove('has-file');try{const buf=await file.arrayBuffer();const b64=await blobToB64(new Blob([buf]));const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflow:workflow.id,input_key:key,filename:file.name,data:b64})});if(state.uploadIds[key]!==uploadId)return;state.tokens[key]=r.uploadToken;state.names[key]=file.name;const activeDrop=currentMediaDrop(workflow.id,key,version,drop);if(activeDrop){activeDrop.classList.add('has-file');activeDrop.querySelector('.fn').textContent='✓ '+file.name+' 已上传'}}catch(e){if(state.uploadIds[key]!==uploadId)return;delete state.tokens[key];delete state.names[key];const activeDrop=currentMediaDrop(workflow.id,key,version,drop);if(activeDrop){activeDrop.classList.remove('has-file');activeDrop.querySelector('.fn').textContent='✗ 上传失败：'+e.message}}}
function currentMediaDrop(workflowId,key,version,original){if(cur?.id!==workflowId)return null;if(version===renderVersion&&original.isConnected)return original;return Array.from(document.querySelectorAll('.drop')).find(item=>item.dataset.mediaKey===key)||null}
function blobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
function readParamValue(el){if(el.type==='checkbox')return el.checked;if(el.value==='')return'';if(el.dataset.paramType==='int')return Number.parseInt(el.value,10);if(el.dataset.paramType==='float'||el.dataset.paramType==='number')return Number(el.value);return el.value}
function collectParams(){const p={};Object.keys(cur.rh_params||{}).forEach(k=>{const el=document.getElementById('param_'+k);if(el){const value=readParamValue(el);if(value!=='')p[k]=value}});return p}
function safeMediaUrl(value){try{const u=new URL(String(value||''),location.origin);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return''}}
function hasRealSeed(j){const value=j?.params?.seed??j?.seed;return typeof value==='number'&&Number.isFinite(value)}
function seedSegment(j){const value=j?.params?.seed??j?.seed;return hasRealSeed(j)?('种子：'+value+' · '):''}
function resultMediaKind(im,url){const type=String(im.file_type||im.fileType||im.outputType||im.output_type||im.type||'').trim().toLowerCase().split(';')[0].replace(/^\./,''),path=new URL(url||location.origin).pathname;if(type==='application/zip'||type==='zip'||/\.zip$/i.test(path))return'file';if(type.startsWith('video/')||['video','mp4','mov','webm','avi','mkv'].includes(type)||/\.(mp4|mov|webm|avi|mkv)$/i.test(path))return'video';if(type.startsWith('image/')||['image','png','jpg','jpeg','webp','gif','avif'].includes(type)||/\.(png|jpe?g|webp|gif|avif)$/i.test(path))return'image';return'file'}
const galleryItems=[];let galleryIndex=-1;
function registerGalleryJob(j){(j.images||[]).forEach((im,i)=>{const key=j.id+':'+i;if(!galleryItems.some(x=>x.key===key))galleryItems.push({key,j,im,i})});if(galleryItems.length){galleryIndex=galleryItems.length-1;renderMediaGallery()}}
function selectGalleryItem(index){if(!galleryItems.length)return;galleryIndex=(index+galleryItems.length)%galleryItems.length;renderMediaGallery()}
function renderMediaGallery(){const main=document.getElementById('galleryMain'),thumbs=document.getElementById('galleryThumbs');if(!main||!thumbs||galleryIndex<0)return;main.replaceChildren();thumbs.replaceChildren();const item=galleryItems[galleryIndex],url=safeMediaUrl(item.im.url),preview=safeMediaUrl(item.im.preview_url),kind=resultMediaKind(item.im,url),note=document.createElement('div');note.className='gallery-meta';note.textContent=seedSegment(item.j)+String(item.im.stage_label||item.im.file||'结果');main.appendChild(note);if(kind==='file'){const file=document.createElement('div');file.className='file-result';file.textContent='结果文件已生成，可直接下载';main.appendChild(file)}else{const media=document.createElement(kind==='video'?'video':'img');media.src=kind==='video'?url:(preview||url);if(kind==='video')media.controls=true;main.appendChild(media)}const actions=document.createElement('div'),download=document.createElement('a'),favorite=document.createElement('button');actions.className='gallery-actions';download.className='dl';download.href=url;download.target='_blank';download.rel='noopener noreferrer';download.textContent=kind==='file'?'⬇ 下载结果文件':'⬇ 下载原文件';favorite.className='dl';favorite.textContent='♥ 收藏';favorite.disabled=kind==='file';favorite.onclick=async()=>{favorite.disabled=true;try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:item.j.id,image_index:item.i})});favorite.textContent='✓ 已收藏'}catch(e){favorite.disabled=false;favorite.textContent='收藏失败：'+e.message}};actions.append(favorite,download);main.appendChild(actions);galleryItems.forEach((entry,index)=>{const b=document.createElement('button');b.className='gallery-thumb'+(index===galleryIndex?' active':'');b.type='button';b.onclick=()=>selectGalleryItem(index);const src=safeMediaUrl(entry.im.preview_url)||safeMediaUrl(entry.im.url);if(resultMediaKind(entry.im,src)==='image'){const img=document.createElement('img');img.src=src;b.appendChild(img)}else{const span=document.createElement('span');span.textContent=resultMediaKind(entry.im,src)==='video'?'▶':'ZIP';b.appendChild(span)}b.title=entry.j.wf_name||entry.j.workflow||'生成结果';thumbs.appendChild(b)});document.getElementById('galleryPrev').disabled=galleryItems.length<2;document.getElementById('galleryNext').disabled=galleryItems.length<2;document.getElementById('mediaGallery').hidden=false;document.getElementById('videoEmpty').classList.add('hidden')}
function addResult(j){registerGalleryJob(j)}
const tasks=new Map(); // job_id -> {card, timeEl, metaEl, spinEl, timer, startTs, wfName}
function fmtTime(s){s=Math.floor(s);const m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return m+':'+ss}
function refreshTaskCount(){const n=tasks.size;document.getElementById('taskCount').textContent=n+' 个任务（最多2个并发）'}
function taskStatusText(j){const s=j.provider_status||j.status;if(j.status==='done')return '✓ 完成';if(j.status==='error')return '✗ 失败';if(s==='SUBMITTING')return '排队中…';if(s==='RUNNING')return '生成中…';return s||'处理中…'}
function videoCoinText(j){if(j.rh_coins!==null&&j.rh_coins!==undefined&&j.rh_coins!=='')return'RH币：'+String(j.rh_coins);return(j.status==='done'||j.status==='error')?'RH币：未返回':'RH币：统计中'}
function taskStatusClass(j){if(j.status==='done')return 'done';if(j.status==='error')return 'err';return ''}
function addTaskCard(jobId,wfName){if(tasks.has(jobId))return tasks.get(jobId);const list=document.getElementById('taskList'),card=document.createElement('div'),spin=document.createElement('div'),info=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div'),time=document.createElement('div'),view=document.createElement('button');card.className='task-card';spin.className='task-spin';info.className='task-info';name.className='task-name';name.textContent=wfName;meta.className='task-meta';meta.setAttribute('aria-live','polite');time.className='task-time';time.textContent='00:00';view.className='task-view';view.type='button';view.textContent='查看结果';view.hidden=true;info.append(name,meta);card.append(spin,info,time,view);list.prepend(card);const t={card,timeEl:time,metaEl:meta,spinEl:spin,viewEl:view,timer:null,startTs:Date.now(),wfName,pollFailures:0};tasks.set(jobId,t);t.timer=setInterval(()=>{t.timeEl.textContent=fmtTime((Date.now()-t.startTs)/1000)},500);refreshTaskCount();return t}
function removeTaskCard(jobId){const t=tasks.get(jobId);if(!t)return;if(t.timer)clearInterval(t.timer);t.card.remove();tasks.delete(jobId);refreshTaskCount()}
function renderTaskResult(j){registerGalleryJob(j)}
async function pollTask(jobId){const t=tasks.get(jobId);if(!t)return;try{const j=await api('/api/job/'+jobId);if(!tasks.has(jobId))return;t.pollFailures=0;t.metaEl.textContent=taskStatusText(j)+' · '+videoCoinText(j);t.spinEl.className='task-spin '+taskStatusClass(j);if(j.status==='done'){if(t.timer){clearInterval(t.timer);t.timer=null}t.timeEl.textContent=fmtTime(j.elapsed||0);renderTaskResult(j);t.viewEl.hidden=!(j.images&&j.images.length);t.viewEl.onclick=()=>{registerGalleryJob(j);document.getElementById('mediaGallery').scrollIntoView({block:'nearest'})};return}if(j.status==='error'){if(t.timer){clearInterval(t.timer);t.timer=null}t.timeEl.textContent='—';t.metaEl.textContent='✗ '+(j.error||'生成失败');return}setTimeout(()=>pollTask(jobId),5000)}catch(error){if(!tasks.has(jobId))return;t.pollFailures++;if(t.pollFailures>=6){if(t.timer){clearInterval(t.timer);t.timer=null}t.spinEl.className='task-spin err';t.timeEl.textContent='—';t.metaEl.textContent='暂时无法获取状态，刷新页面可恢复';return}t.metaEl.textContent='状态连接中断，正在重试 '+t.pollFailures+'/6';setTimeout(()=>pollTask(jobId),Math.min(12000,4000+t.pollFailures*1500))}}
async function generate(){if(genRunning)return;if(!cur)return;const workflow=cur,state=ensureMediaState(workflow.id);genRunning=true;const btn=document.getElementById('genBtn');btn.disabled=true;btn.classList.add('is-loading');const st=document.getElementById('genStatus');st.textContent='正在提交…';document.getElementById('genResult').innerHTML='';let pending={};try{pending=JSON.parse(localStorage.getItem(pendingVideoSubmitKey)||'{}')}catch{}const client_request_id=pending.workflow===workflow.id&&pending.id?pending.id:'video-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem(pendingVideoSubmitKey,JSON.stringify({workflow:workflow.id,id:client_request_id}));try{const prompt=(document.getElementById('param_prompt')?.value||'').trim();if(!prompt)throw new Error('提示词不能为空');const required=Object.entries(workflow.rh_media||{}).filter(([,m])=>m.required).map(([k])=>k);const missing=required.filter(k=>!state.tokens[k]);if(missing.length)throw new Error('缺少必传素材：'+missing.join(', '));const body={workflow:workflow.id,prompt:prompt,negative_prompt:(document.getElementById('param_negative')?.value||'').trim(),media:{...state.tokens},params:collectParams(),client_request_id};const r=await api('/api/video-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});localStorage.removeItem(pendingVideoSubmitKey);if(!r.job_id)throw new Error(r.error||'提交失败');addTaskCard(r.job_id,workflow.name);st.textContent='✓ 已提交，任务 '+r.job_id+' 在下方队列中';pollTask(r.job_id)}catch(e){const definitiveRejection=e.status>=400&&e.status<500;if(definitiveRejection)localStorage.removeItem(pendingVideoSubmitKey);st.textContent='✗ '+e.message+(definitiveRejection?'':'；网络不明时再次点击会复用请求号')}finally{genRunning=false;btn.classList.remove('is-loading');btn.disabled=false}}
async function history(){const l=document.getElementById('histList');l.textContent='加载中…';const a=await api('/api/jobs?scope=video');l.replaceChildren();a.filter(j=>j.workflow&&WFS.find(w=>w.id===j.workflow)).slice(0,10).forEach(j=>{const w=WFS.find(x=>x.id===j.workflow),d=document.createElement('div'),title=document.createElement('b'),note=document.createElement('div'),button=document.createElement('button');d.className='job';title.textContent=w?w.name:'视频';note.className='note';note.textContent=j.status+' · '+videoCoinText(j)+' · '+(j.elapsed||'')+'秒';button.className='dl';button.textContent='查看结果';button.onclick=()=>{addResult(j);histOverlay.classList.remove('open')};d.append(title,note,button);l.appendChild(d)})}
async function favorites(){const l=document.getElementById('favList');l.textContent='加载中…';const a=await api('/api/favorites');l.replaceChildren();a.filter(f=>f.style_id==='video').forEach(f=>{const d=document.createElement('div');d.className='job';const promptNode=document.createElement('div');promptNode.className='note';promptNode.textContent=(f.prompt||'').slice(0,120);const isVideo=String(f.favorite_media_type||'').startsWith('video/'),media=document.createElement(isVideo?'video':'img');media.src=f.image_url;if(isVideo)media.controls=true;const link=document.createElement('a');link.className='dl';link.href=f.image_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='⬇ 下载';d.append(promptNode,media,link);l.appendChild(d)})}

const CREATOR_ROUTES=['/','/realism','/video'];function scheduleRoutePrefetch(){const connection=navigator.connection||{};if(connection.saveData||/2g/.test(connection.effectiveType||''))return;const loaded=new Set(),load=href=>{if(!CREATOR_ROUTES.includes(href)||href===location.pathname||loaded.has(href))return;loaded.add(href);const link=document.createElement('link');link.rel='prefetch';link.as='document';link.href=href;document.head.appendChild(link)};document.querySelectorAll('.topnav-link').forEach(a=>{const href=a.getAttribute('href');a.addEventListener('pointerenter',()=>load(href),{once:true});a.addEventListener('focus',()=>load(href),{once:true})});const idle=()=>CREATOR_ROUTES.filter(x=>x!==location.pathname).slice(0,2).forEach(load);'requestIdleCallback'in window?requestIdleCallback(idle,{timeout:2500}):setTimeout(idle,1800)}scheduleRoutePrefetch();</script></body></html>
