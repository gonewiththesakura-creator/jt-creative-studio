/* Shared workbench material. Edge highlights approximate thickness, not optical refraction. */
:root {
  --app-background-image:radial-gradient(ellipse at 12% 12%,#e1e7f8 0%,transparent 48%),radial-gradient(ellipse at 92% 86%,#dfeee9 0%,transparent 46%);
  --app-background-size:cover;
  --app-background-position:center;
  --app-background-opacity:1;
  --app-background-veil:rgba(246,247,251,.28);
  --text:#20222a;
  --muted:#626a79;
  --border:rgba(68,80,112,.16);
  --success:#237760;
  --danger:#a23c3c;
  --warning:#8b551f;
  --focus-ring:#4057d9;
  --glass-tint:rgba(255,255,255,.76);
  --glass-chrome:rgba(255,255,255,.82);
  --glass-dialog:rgba(255,255,255,.94);
  --glass-blur:18px;
  --glass-saturation:125%;
  --glass-edge:rgba(255,255,255,.92);
  --glass-edge-shade:rgba(63,78,113,.14);
  --glass-shadow:0 10px 30px rgba(31,43,75,.08);
  --surface:#fff;
  --surface-soft:rgba(247,249,253,.94);
  --soft:var(--surface-soft);
  --field-surface:rgba(255,255,255,.96);
  --selected-surface:#edf0ff;
  --radius-shell:22px;
  --radius-panel:14px;
  --radius-control:10px;
}
body {background:transparent;isolation:isolate;color:var(--text)}
.app-background {position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--canvas);overflow:hidden}
.app-background::before,.app-background::after {content:"";position:absolute;inset:0;pointer-events:none}
.app-background::before {background-image:var(--app-background-image);background-size:var(--app-background-size);background-position:var(--app-background-position);background-repeat:no-repeat;opacity:var(--app-background-opacity)}
.app-background::after {background:var(--app-background-veil)}
.app-shell {background:transparent}
.topbar,.creation-pane,.preview-stage,.library-panel,.api-popover,.api-settings-popover,.api-drawer {
  background:var(--surface);
  border-color:var(--border);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 var(--glass-edge-shade);
}
.creation-pane,.preview-stage,.library-panel {position:relative;border-radius:var(--radius-shell)}
.topbar {position:relative;z-index:70}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
  .topbar,.creation-pane,.preview-stage,.library-panel,.api-popover,.api-settings-popover,.api-drawer {
    background:var(--glass-tint);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));
    backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));
  }
  .topbar {background:var(--glass-chrome)}
  .library-panel,.api-popover,.api-settings-popover,.api-drawer {background:var(--glass-dialog)}
}
/* Only the thin perimeter moves; text, hit targets, blur and large surfaces remain still. */
@supports ((mask-composite:exclude) or (-webkit-mask-composite:xor)) {
  .creation-pane::after,.preview-stage::after,.library-panel::after,.api-popover::after,.api-settings-popover::after {
    content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,255,255,.28) 35%,rgba(80,108,159,.18) 65%,rgba(255,255,255,.72));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    transition:transform 220ms ease,opacity 220ms ease;
  }
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference) {
  .creation-pane:hover::after,.preview-stage:hover::after,.library-panel:hover::after,
  .creation-pane:focus-within::after,.preview-stage:focus-within::after,.library-panel:focus-within::after {
    transform:translateY(-.4px) scaleX(1.002);
  }
}
.creation-footer {flex-shrink:0;background:var(--field-surface)}
.library-header,.library-scroll {background:transparent}
.library-scroll {overscroll-behavior:contain}
.library-scroll .job :is(img,video) {display:block;width:100%;max-width:100%;height:auto;max-height:54vh;object-fit:contain;border-radius:10px;background:#f1f3f7}
.drawer,.config-drawer,.panel.form,.task-panel-head,.task-card,.job {background:var(--field-surface);border-color:var(--border)}
.item,.control,.settings,.switch {background:var(--surface-soft)}
.switch button.active,.topnav-link.active,.result-tab.active {background:var(--selected-surface);color:#3549b7}
.creation-scroll :is(input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea),
.api-popover :is(input:not([type=checkbox]):not([type=radio]),select,textarea),
.api-drawer :is(input:not([type=checkbox]):not([type=radio]),select,textarea) {background:var(--field-surface);color:var(--text);max-width:100%;min-width:0}
.gallery-main {background:#f1f3f7}
.gallery-main:has(video) {background:#15171c}
.gallery-main video,.gallery-main img {max-width:100%}
.gallery-actions {background:var(--field-surface)}
.preview-header {flex-wrap:wrap;gap:10px}
.preview-header h2 {flex-shrink:0}
.preview-header .note {width:auto}
.studio-grid,.creation-scroll,.creation-pane,.preview-pane,.task-info,.task-name,.task-meta,.status,.workflow-note,.control-head,.control-title,.bool-row {min-width:0}
.task-info {flex:1;margin-left:0}
.task-spin,.task-time {flex-shrink:0}
.task-card {max-width:100%}
.task-name,.task-meta,.status,.workflow-note,.note,.upload-status,.drop .fn,.gallery-meta,.control-title,.control-help,.job,.file-result {overflow-wrap:anywhere}
.drop .local-media-preview {display:block;width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin-top:12px;background:rgba(20,25,40,.05)}
.note,.task-meta,.workflow-note,.control-help,.upload-status,.section-label,.field-label,.form label,.item-name,.settings label {font-size:12px}
.preview-caption {max-width:calc(100% - 60px);overflow-wrap:anywhere}
.task-panel-head {gap:8px;flex-wrap:wrap}
.topnav {min-width:0}
.topbar-tools {flex-shrink:0}
:is(button,a,input,select,textarea,[tabindex]):focus-visible {outline:2px solid var(--focus-ring);outline-offset:2px}
.library-overlay {padding-bottom:max(20px,env(safe-area-inset-bottom))}

@media (pointer:coarse) {
  button,.topnav-link,.dl,.drop,.upload-box {min-height:44px}
  .item-actions button,.close {min-width:44px;min-height:44px}
}
@media(max-width:820px) {
  :root {--glass-blur:12px;--glass-tint:rgba(255,255,255,.86)}
  body {height:auto;overflow:auto}
  .app-shell {height:auto;overflow:visible}
  .studio-grid {height:auto;grid-template-columns:minmax(0,1fr);padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
  .creation-scroll {height:auto;overflow:visible;padding:14px}
  .creation-footer {position:static;inset:auto;z-index:auto;padding:12px 14px 14px;border:0;border-top:1px solid var(--border);border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .topbar {gap:8px;padding:10px 12px;position:relative}
  .topnav {flex:0 0 100%;width:100%;order:3}
  .brand {gap:7px;font-size:14px}
  .brand-mark {width:30px;height:30px}
  .topbar-tools {gap:5px}
  .topbar-action {min-width:44px;padding:0 7px;font-size:11px}
  button,.topnav-link,.dl,.drop,.upload-box {min-height:44px}
  .item-actions button,.close {min-width:44px;min-height:44px}
  .creation-scroll :is(input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea),
  .api-popover :is(input:not([type=checkbox]):not([type=radio]),select,textarea),
  .api-drawer :is(input:not([type=checkbox]):not([type=radio]),select,textarea) {min-height:44px;font-size:16px}
  .result-tabs {flex:1 0 100%;width:100%}
  .result-tab {flex:1;min-width:0}
  .task-card:has(>.task-info) {display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:start;gap:8px}
  .task-card>.task-view {grid-column:2 / -1;margin:0;width:100%}
  .task-time {margin-left:0;float:none}
  .gallery-actions,.result-actions {grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery-actions>* {min-width:0;overflow-wrap:anywhere}
  .preview-stage {min-height:390px}
  .library-overlay {padding:8px 8px max(8px,env(safe-area-inset-bottom));height:100vh;height:100dvh}
  .library-panel {max-height:100%;border-radius:16px}
}
@media(prefers-reduced-motion:reduce) {
  .creation-pane::after,.preview-stage::after,.library-panel::after,.api-popover::after,.api-settings-popover::after {transition:none;transform:none}
}
@media(prefers-reduced-transparency:reduce) {
  .topbar,.creation-pane,.preview-stage,.library-panel,.api-popover,.api-settings-popover,.api-drawer {background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* Compact task contact sheets; only the selected result owns a media player. */
#taskList{max-height:none;overflow:visible;contain:none;padding:12px}
.task-group h3{margin:4px 0 10px;font-size:12px;font-weight:600;color:#c0bcb7}
.task-group summary{padding:10px 0;cursor:pointer;font-size:12px;color:#c0bcb7}.task-group[open] summary{margin-bottom:6px}
.task-configuration{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;color:#d4c6b1;max-height:200px;overflow:auto}
.gallery-job-hint{position:fixed;z-index:220;width:min(360px,calc(100vw - 16px));max-height:min(320px,60vh);overflow:hidden;padding:12px 14px;border:1px solid #bda57f55;border-radius:10px;background:#191a20f7;color:#ddd5c8;box-shadow:0 8px 24px #0006;font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
.task-group+.task-group{margin-top:18px}
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
#taskList .task-card{display:block;min-width:0;margin:0;padding:0;border:0;background:transparent;box-shadow:none}
.task-tile{position:relative;display:block;width:100%;aspect-ratio:16/10;padding:0;overflow:hidden;border:1px solid #ffffff24;border-radius:10px;background:#181a20;color:#c6c3be;cursor:pointer}
.task-tile:hover,.task-tile:focus-visible{border-color:#d2b986;outline:2px solid #d2b98644;outline-offset:2px}
.task-picture{position:absolute;inset:0 0 28px;display:grid;place-items:center;min-height:0;font-size:26px;background:#202127}
.task-picture img{display:block;width:100%;height:100%;min-height:0;object-fit:contain}
.task-picture small{position:absolute;bottom:-22px;right:6px;font-size:9px;color:#aaa}
.task-badge{position:absolute;bottom:6px;left:6px;padding:4px 7px;border-radius:5px;background:#151820e8;color:#d6d8df;font-size:11px;font-weight:600;line-height:1.3}
.task-card[data-status=done] .task-badge{background:#163c30ed;color:#b8eed4}
.task-card[data-status=running] .task-badge,.task-card[data-status=recovering] .task-badge{background:#263a59ed;color:#c6dfff}
.task-card[data-status=queued] .task-badge{background:#473b22ed;color:#f2da9e}
.task-card[data-status=error] .task-badge{background:#522929ed;color:#ffcccc}

.task-details .task-name{font-size:13px;font-weight:650}.task-details .queue-files{margin:8px 0;color:#bcbac2}.task-details .task-meta{color:#d2c4ab}.task-details .task-time{float:none;margin:4px 0;font-size:11px;font-weight:400;color:#aaa}.task-details .task-view{margin:10px 0 0;width:100%;min-height:34px}.task-details .queue-actions button{min-height:34px}.task-details::backdrop{background:transparent;pointer-events:none}
.media-gallery{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.gallery-viewer{position:relative;min-width:0}
.gallery-navigation{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.gallery-navigation .gallery-nav{position:relative;pointer-events:auto;width:44px;height:44px;min-height:0;padding:0;border:0;border-radius:50%;background:transparent;color:#f5f1e9;box-shadow:none;font-size:0;cursor:pointer;opacity:.72;transition:opacity .15s ease}
.gallery-navigation .gallery-nav::after{content:"";position:absolute;inset:5px;border:1px solid #ffffff26;border-radius:50%;background:#d5cfbf14;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 8px #0002}
.gallery-navigation .gallery-nav::before{content:"";position:absolute;z-index:1;top:18px;left:20px;width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.gallery-navigation #galleryNext::before{left:17px;transform:rotate(225deg)}
.gallery-navigation .gallery-nav:hover,.gallery-navigation .gallery-nav:focus-visible{opacity:1}.gallery-navigation .gallery-nav:hover::after{background:#d5cfbf2b}.gallery-navigation .gallery-nav:disabled{visibility:hidden;pointer-events:none}
.gallery-main{min-height:0;display:grid;grid-template-rows:34px clamp(240px,52vh,680px) 56px;align-items:stretch;justify-content:stretch;width:100%}.gallery-meta{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.gallery-viewport{position:relative;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;background:#0b0e12}.gallery-main .gallery-viewport video,.gallery-main .gallery-viewport img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;display:block}.gallery-actions{min-height:0}.gallery-thumbs{min-height:0;flex-shrink:0;overflow-anchor:none}.gallery-thumb{height:54px;flex-basis:70px}.gallery-actions .dl{margin:0}.preview-stage{overflow-anchor:none}
.gallery-thumb img{object-fit:contain;background:#202127}.gallery-thumb{background:#202127}
@media(max-width:600px){.task-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gallery-navigation{padding:0 4px}.task-panel-head{gap:8px;flex-wrap:wrap}}

"下一个结果">›</button></div></div><div class="gallery-thumbs" id="galleryThumbs"></div></section><section class="panel" id="taskPanel"><div class="task-panel-head"><b>视频任务</b><span class="note" id="taskCount">0 个任务</span></div><div id="taskList"></div></section><div class="result" id="genResult"></div></div></section></main><div class="library-overlay" id="histOverlay"><div class="library-panel"><div class="library-header"><h2>历史记录</h2><button class="close">×</button></div><div class="library-scroll"><div id="histList"></div></div></div></div><div class="library-overlay" id="favOverlay"><div class="library-panel"><div class="library-header"><h2>我的收藏</h2><button class="close">×</button></div><div class="library-scroll"><div id="favList"></div></div></div></div></div><script>function renderLoraSettings(form, params, state) {
  const controls = params.filter(([, param]) => param.group === 'lora' && param.type === 'select');
  if (!controls.length) return;
  const details = document.createElement('details');
  details.className = 'lora-settings';
  const summary = document.createElement('summary');
  summary.textContent = 'LoRA 详细调整';
  const note = document.createElement('p');
  note.textContent = '按下列顺序依次加载。强度为 0 时不产生影响；收起面板仍会使用当前设置。';
  details.append(summary, note);
  state.loraParams ??= {};
  const resets = [];
  controls.forEach(([modelKey, modelParam]) => {
    const key = modelKey.replace(/_model$/, '_strength');
    const param = params.find(([name]) => name === key)[1];
    const row = document.createElement('div');
    row.className = 'lora-setting';
    const label = document.createElement('label');
    label.htmlFor = 'param_' + modelKey;
    label.textContent = modelParam.label;
    const select = document.createElement('select');
    select.id = 'param_' + modelKey;
    select.dataset.paramType = 'select';
    for (const option of modelParam.options) {
      const item = document.createElement('option');
      item.value = optionValue(option); item.textContent = optionLabel(option);
      select.append(item);
    }
    select.value = state.loraParams[modelKey] ?? modelParam.default;
    const inputs = document.createElement('div');
    inputs.className = 'lora-strength-inputs';
    const range = document.createElement('input');
    const number = document.createElement('input');
    range.type = 'range'; number.type = 'number';
    range.setAttribute('aria-label', param.label + '滑块');
    number.id = 'param_' + key;
    number.setAttribute('aria-label', param.label);
    number.dataset.paramType = 'float';
    number.required = true;
    for (const input of [range, number]) {
      input.min = param.min; input.max = param.max; input.step = param.step;
      input.value = state.loraParams[key] ?? param.default;
    }
    const remember = () => { state.loraParams[key] = number.value; };
    range.oninput = () => { number.value = range.value; remember(); };
    number.oninput = () => {
      if (number.value !== '' && number.validity.valid) range.value = number.value;
      remember();
    };
    const updateEnabled = () => { range.disabled = number.disabled = select.value === 'none'; };
    select.onchange = () => { state.loraParams[modelKey] = select.value; updateEnabled(); };
    updateEnabled();
    resets.push(() => { select.value = modelParam.default; select.onchange(); range.value = number.value = param.default; remember(); });
    inputs.append(range, number); row.append(label, select, inputs); details.append(row);
  });
  const reset = document.createElement('button');
  reset.type = 'button'; reset.className = 'lora-reset';
  reset.textContent = '恢复默认设置';
  reset.onclick = () => resets.forEach(apply => apply());
  details.append(reset); form.append(details);
}

const CREATOR_ROUTES=['/','/realism','/video'];function scheduleRoutePrefetch(){const connection=navigator.connection||{};if(connection.saveData||/2g/.test(connection.effectiveType||''))return;const loaded=new Set(),load=href=>{if(!CREATOR_ROUTES.includes(href)||href===location.pathname||loaded.has(href))return;loaded.add(href);const link=document.createElement('link');link.rel='prefetch';link.as='document';link.href=href;document.head.appendChild(link)};document.querySelectorAll('.topnav-link').forEach(a=>{const href=a.getAttribute('href');a.addEventListener('pointerenter',()=>load(href),{once:true});a.addEventListener('focus',()=>load(href),{once:true})});const idle=()=>CREATOR_ROUTES.filter(x=>x!==location.pathname).slice(0,2).forEach(load);'requestIdleCallback'in window?requestIdleCallback(idle,{timeout:2500}):setTimeout(idle,1800)}scheduleRoutePrefetch();</script></body></html>
