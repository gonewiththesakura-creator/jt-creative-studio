<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JT 视频生成面板 · RunningHub</title><style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#2f3b40;--muted:#82949c;--line:#e1eaed;--accent:#769fb2;--accent2:#eaf3f6;--shadow:0 12px 34px rgba(67,89,99,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f9fbfc,var(--bg));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:30px 0 80px}.hero h1{margin:0;font-size:clamp(28px,4.5vw,44px)}.hero p{color:var(--muted);line-height:1.7}.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.switch{padding:14px;margin:14px 0;display:flex;gap:8px;flex-wrap:wrap}.switch button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;color:#667c86;font-weight:800;cursor:pointer;text-align:left}.switch button.active{background:var(--accent);color:#fff;border-color:transparent}.form{padding:16px 18px;margin:12px 0}.form label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:12px 0 6px}.form input[type=text],.form input[type=number],.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:#45565e}.form textarea{min-height:90px;resize:vertical}.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:#fbfdfe;transition:.18s}.drop.drag{border-color:var(--accent);background:var(--accent2)}.drop .fn{font-weight:800;color:#5f8290;word-break:break-all}.primary{width:100%;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#86b3c6,#6f9eb2);color:#fff;font-weight:850;cursor:pointer;margin-top:16px;font-size:16px}.primary:disabled{opacity:.55;cursor:wait}.status{font-size:13px;color:#607985;font-weight:750;margin:12px 0}.result img,.result video{width:100%;max-height:640px;object-fit:contain;border-radius:12px;background:#111;margin-top:8px}.dl{display:block;width:100%;border:0;text-align:center;margin-top:7px;padding:10px;border-radius:10px;background:#edf4f7;color:#5f8290;font-weight:750;text-decoration:none;cursor:pointer}.floating{position:fixed;right:14px;z-index:50;border:1px solid var(--line);border-radius:16px;padding:10px 13px;background:#fff;box-shadow:var(--shadow);cursor:pointer}.history{bottom:18px}.favorites{bottom:66px}.overlay{display:none;position:fixed;inset:0;z-index:80;background:rgba(244,247,248,.98);overflow:auto;padding:15px}.overlay.open{display:block}.overlay-inner{max-width:680px;margin:auto}.overlay-head{display:flex;justify-content:space-between;align-items:center}.job{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;margin:10px 0}.close{border:0;background:none;font-size:25px;cursor:pointer}.note{font-size:12px;color:#96a7ad;line-height:1.6;margin:6px 0}.back{display:inline-block;margin-bottom:12px;text-decoration:none;color:#5f8290;font-weight:800;font-size:13px}
.overlay.loading{display:none;position:fixed;inset:0;z-index:90;background:rgba(20,32,38,.72);backdrop-filter:blur(3px);align-items:center;justify-content:center;overflow:hidden}
.overlay.loading.open{display:flex}
.loading-card{background:#fff;border-radius:22px;padding:38px 44px;text-align:center;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.spinner{width:56px;height:56px;border:5px solid #dbe7ec;border-top-color:#6f9eb2;border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-size:20px;font-weight:850;color:#2f3b40;margin-bottom:8px}
.loading-sub{font-size:13px;color:#82949c;font-weight:700;margin-bottom:6px}
.loading-time{font-size:34px;font-weight:850;color:#5f8290;font-variant-numeric:tabular-nums;margin:10px 0}
.loading-note{font-size:12px;color:#9aabb2;line-height:1.7;margin-top:6px}
.task-panel-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.task-panel-head .note{display:inline;font-size:12px;color:#96a7ad}
.task-card{border:1px solid var(--line);border-radius:14px;background:#fbfdfe;margin:10px 12px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.task-spin{width:34px;height:34px;border:4px solid #dbe7ec;border-top-color:#6f9eb2;border-radius:50%;flex:0 0 34px;animation:spin 1s linear infinite}
.task-spin.done{border-color:#8fbf9f;border-top-color:#5a9e6e;animation:none}
.task-spin.err{border-color:#e2b6b0;border-top-color:#c26a4a;animation:none}
.task-info{flex:1;min-width:220px}
.task-name{font-size:13px;font-weight:850;color:#45565e}
.task-meta{font-size:12px;color:#96a7ad;margin-top:4px;line-height:1.6}
.task-time{font-size:22px;font-weight:850;color:#5f8290;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.task-result{flex-basis:100%;margin-top:6px}
.task-result img,.task-result video{width:100%;max-height:480px;object-fit:contain;border-radius:10px;background:#111}
.task-result .dl{display:block;width:100%;border:0;text-align:center;margin-top:6px;padding:9px;border-radius:10px;background:#edf4f7;color:#5f8290;font-weight:750;text-decoration:none;cursor:pointer}
</style></head><body><main class="wrap"><section class="hero"><a class="back" href="/">← 返回三画风主页</a><h1>🎬 视频生成面板</h1><p>RunningHub 云端视频工作流：MiniMax H3 文生/图生/首尾帧、Wan2.2 换装带货、动作迁移。上传素材、填提示词即可提交；不影响原有生图页面。</p></section>
<section class="panel switch" id="wfSwitch"></section>
<section class="panel form" id="wfForm"></section>
<button class="primary" id="genBtn">🚀 提交视频任务</button><div class="status" id="genStatus"></div>
<section class="panel" id="taskPanel" style="margin-top:18px"><div class="task-panel-head"><b>📋 我的视频任务</b><span class="note" id="taskCount" style="display:inline">0 个任务</span></div><div id="taskList"></div></section>
<div class="result" id="genResult"></div></main>
<button class="floating favorites" id="favOpen">♥ 收藏</button><button class="floating history" id="histOpen">📁 历史</button>
<div class="overlay" id="histOverlay"><div class="overlay-inner"><div class="overlay-head"><h2>历史记录</h2><button class="close">×</button></div><div id="histList"></div></div></div>
<div class="overlay" id="favOverlay"><div class="overlay-inner"><div class="overlay-head"><h2>我的收藏</h2><button class="close">×</button></div><div id="favList"></div></div></div>
<script>
const api=async(path,opt={})=>{const r=await fetch(path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d};
let WFS=[],cur=null,mediaFiles={},genRunning=false;
async function init(){const a=await api('/api/workflows');WFS=a.filter(w=>w.kind==='video');const box=document.getElementById('wfSwitch');box.innerHTML='';WFS.forEach(w=>{const b=document.createElement('button');b.dataset.wf=w.id;b.innerHTML='<b>'+w.name+'</b>';b.onclick=()=>{cur=w;renderForm();renderSwitch()};box.appendChild(b)});if(WFS.length)cur=WFS[0];renderForm();renderSwitch()}
function renderSwitch(){document.querySelectorAll('#wfSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.wf===cur.id))}
function isVideoType(t){return t==='video'}
function renderForm(){const f=document.getElementById('wfForm');f.innerHTML='<div class="note"><b>'+cur.name+'</b><br>'+cur.desc+'</div>';
  const media=Object.entries(cur.rh_media||{});
  media.forEach(([key,m])=>{const lab=document.createElement('label');lab.textContent=m.label+(m.required?'（必传）':'（可选）');f.appendChild(lab);
    const drop=document.createElement('div');drop.className='drop';drop.innerHTML='<span>点击选择或拖入文件</span><div class="fn"></div>';drop.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept=isVideoType(m.type)?'video/*':'image/*';inp.onchange=()=>{if(inp.files[0])uploadMedia(key,m,inp.files[0],drop)};inp.click()};
    f.appendChild(drop)});
  const params=Object.entries(cur.rh_params||{});
  params.forEach(([key,p])=>{if(key==='prompt'||key==='negative'){const lab=document.createElement('label');lab.textContent=p.label+(key==='prompt'?'（必填）':'');f.appendChild(lab);const ta=document.createElement('textarea');ta.id='param_'+key;if(cur.prompt_placeholder&&key==='prompt')ta.placeholder=cur.prompt_placeholder;if(key==='prompt'&&cur.prompt_hint){const h=document.createElement('div');h.className='note';h.style.color='#c26a4a';h.textContent=cur.prompt_hint;f.appendChild(h)}f.appendChild(ta);return}
    const lab=document.createElement('label');lab.textContent=p.label;f.appendChild(lab);
    if(p.type==='number'){const inp=document.createElement('input');inp.type='number';inp.id='param_'+key;const d=(cur.params_defaults||{})[key];if(d!==undefined)inp.value=d;f.appendChild(inp)}
    else{const inp=document.createElement('input');inp.type='text';inp.id='param_'+key;const d=(cur.params_defaults||{})[key];if(d!==undefined)inp.value=d;f.appendChild(inp)}})}
async function uploadMedia(key,m,file,drop){const fnEl=drop.querySelector('.fn');fnEl.textContent='上传中…';try{const buf=await file.arrayBuffer();const b64=await blobToB64(new Blob([buf]));const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,data:b64})});mediaFiles[key]=r.fileName;fnEl.textContent='✓ '+file.name+' → '+r.fileName.slice(0,24)+'…';drop.style.borderColor='#8fbf9f'}catch(e){fnEl.textContent='✗ 上传失败：'+e.message;mediaFiles[key]=undefined}}
function blobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
function collectParams(){const p={};Object.keys(cur.rh_params||{}).forEach(k=>{const el=document.getElementById('param_'+k);if(el&&el.value!=='')p[k]=el.value});return p}
function addResult(j,container){container.innerHTML='';(j.images||[]).forEach((im,i)=>{const w=document.createElement('div');w.className='job';const isVid=/\.(mp4|mov|webm|avi|mkv)(\?|$)/i.test(im.url);w.innerHTML='<div class="note">种子：'+(j.seed??j.sequence_seed??'未知')+' · '+im.file+'</div>'+(isVid?'<video src="'+im.url+'" controls></video>':'<img src="'+(im.preview_url||im.url)+'">')+'<button class="dl fav">♥ 收藏此结果</button><a class="dl" target="_blank" href="'+im.url+'">⬇ 下载原文件</a>';w.querySelector('.fav').onclick=async e=>{e.target.disabled=true;e.target.textContent='收藏中…';try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:j.id,image_index:i})});e.target.textContent='✓ 已收藏'}catch(x){e.target.disabled=false;e.target.textContent='收藏失败：'+x.message}};container.appendChild(w)})}
const tasks=new Map(); // job_id -> {card, timeEl, metaEl, spinEl, timer, startTs, wfName}
function fmtTime(s){s=Math.floor(s);const m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return m+':'+ss}
function refreshTaskCount(){const n=tasks.size;document.getElementById('taskCount').textContent=n+' 个任务（最多3个并发）'}
function taskStatusText(j){const s=j.provider_status||j.status;if(j.status==='done')return '✓ 完成';if(j.status==='error')return '✗ 失败';if(s==='SUBMITTING')return '排队中…';if(s==='RUNNING')return '生成中…';return s||'处理中…'}
function taskStatusClass(j){if(j.status==='done')return 'done';if(j.status==='error')return 'err';return ''}
function addTaskCard(jobId,wfName){if(tasks.has(jobId))return;const list=document.getElementById('taskList');const card=document.createElement('div');card.className='task-card';card.innerHTML='<div class="task-spin"></div><div class="task-info"><div class="task-name">'+wfName+'</div><div class="task-meta" id="meta_'+jobId+'">排队中…</div></div><div class="task-time" id="time_'+jobId+'">00:00</div><div class="task-result" id="res_'+jobId+'"></div>';list.prepend(card);const t={card,timeEl:card.querySelector('#time_'+jobId),metaEl:card.querySelector('#meta_'+jobId),spinEl:card.querySelector('.task-spin'),resEl:card.querySelector('#res_'+jobId),timer:null,startTs:Date.now(),wfName};tasks.set(jobId,t);t.timer=setInterval(()=>{t.timeEl.textContent=fmtTime((Date.now()-t.startTs)/1000)},500);refreshTaskCount()}
function removeTaskCard(jobId){const t=tasks.get(jobId);if(!t)return;if(t.timer)clearInterval(t.timer);t.card.remove();tasks.delete(jobId);refreshTaskCount()}
function renderTaskResult(j,resEl){resEl.innerHTML='';(j.images||[]).forEach((im,i)=>{const isVid=/\.(mp4|mov|webm|avi|mkv)(\?|$)/i.test(im.url);const w=document.createElement('div');w.innerHTML=(isVid?'<video src="'+im.url+'" controls></video>':'<img src="'+(im.preview_url||im.url)+'">')+'<a class="dl" target="_blank" href="'+im.url+'">⬇ 下载原文件</a>';resEl.appendChild(w)})}
function pollTask(jobId){const t=tasks.get(jobId);if(!t)return;api('/api/job/'+jobId).then(j=>{if(!tasks.has(jobId))return;t.metaEl.textContent=taskStatusText(j);t.spinEl.className='task-spin '+taskStatusClass(j);if(j.status==='done'){if(t.timer){clearInterval(t.timer);t.timer=null}t.timeEl.textContent=fmtTime(j.elapsed||0);renderTaskResult(j,t.resEl);if(j.images&&j.images.length){const im=j.images[0];const fav=document.createElement('button');fav.className='dl';fav.textContent='♥ 收藏此结果';fav.onclick=async e=>{e.target.disabled=true;e.target.textContent='收藏中…';try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId,image_index:0})});e.target.textContent='✓ 已收藏'}catch(x){e.target.disabled=false;e.target.textContent='收藏失败：'+x.message}};t.resEl.appendChild(fav)}}else if(j.status==='error'){if(t.timer){clearInterval(t.timer);t.timer=null}t.timeEl.textContent='—';t.metaEl.textContent='✗ '+(j.error||'生成失败');setTimeout(()=>removeTaskCard(jobId),8000)}else{setTimeout(()=>pollTask(jobId),5000)}}).catch(()=>{setTimeout(()=>pollTask(jobId),8000)})}
async function generate(){if(genRunning)return;if(!cur)return;genRunning=true;const btn=document.getElementById('genBtn');btn.disabled=true;const st=document.getElementById('genStatus');st.textContent='正在提交…';document.getElementById('genResult').innerHTML='';try{const prompt=(document.getElementById('param_prompt')?.value||'').trim();if(!prompt)throw new Error('提示词不能为空');const required=Object.entries(cur.rh_media||{}).filter(([,m])=>m.required).map(([k])=>k);const missing=required.filter(k=>!mediaFiles[k]);if(missing.length)throw new Error('缺少必传素材：'+missing.join(', '));const body={workflow:cur.id,prompt:prompt,negative_prompt:(document.getElementById('param_negative')?.value||'').trim(),media:mediaFiles,params:collectParams()};const r=await api('/api/video-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.job_id)throw new Error(r.error||'提交失败');addTaskCard(r.job_id,cur.name);st.textContent='✓ 已提交，任务 '+r.job_id+' 在下方队列中';pollTask(r.job_id)}catch(e){st.textContent='✗ '+e.message}finally{genRunning=false;btn.disabled=false}}
async function history(){const l=document.getElementById('histList');l.innerHTML='加载中…';const a=await api('/api/jobs');l.innerHTML='';a.filter(j=>j.workflow&&WFS.find(w=>w.id===j.workflow)).slice(0,10).forEach(j=>{const w=WFS.find(x=>x.id===j.workflow);const d=document.createElement('div');d.className='job';d.innerHTML='<b>'+(w?w.name:'视频')+'</b><div class="note">'+j.status+' · '+(j.elapsed||'')+'秒</div><button class="dl">查看结果</button>';d.querySelector('button').onclick=()=>addResult(j,d);l.appendChild(d)})}
async function favorites(){const l=document.getElementById('favList');l.innerHTML='加载中…';const a=await api('/api/favorites');l.innerHTML='';a.forEach(f=>{const d=document.createElement('div');d.className='job';d.innerHTML='<div class="note">'+(f.prompt||'').slice(0,120)+'</div><img src="'+(f.preview_url||f.image_url)+'"><a class="dl" href="'+f.image_url+'" target="_blank">⬇ 下载</a>';l.appendChild(d)})}
document.getElementById('genBtn').onclick=generate;document.getElementById('histOpen').onclick=()=>{histOverlay.classList.add('open');history()};document.getElementById('favOpen').onclick=()=>{favOverlay.classList.add('open');favorites()};document.querySelectorAll('.overlay .close').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('open'));init();
</script></body></html>
