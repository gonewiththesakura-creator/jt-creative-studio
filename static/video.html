<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JT 视频工作台</title><style>
:root{--brand:#536cff;--brand-dark:#4057e8;--canvas:#f6f7fb;--surface:#ffffff;--surface-soft:#fafbfe;--text:#20222a;--muted:#8b8f9a;--border:#e7e9f0;--shadow:0 14px 40px rgba(36,42,68,.08)}*{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;background:var(--canvas);color:var(--text);height:100vh;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.app-shell{height:100vh;overflow:hidden}.topbar{height:68px;display:flex;align-items:center;gap:28px;padding:0 28px;background:#fff;border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:900;text-decoration:none;white-space:nowrap}.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:13px}.topnav{display:flex;gap:6px;overflow-x:auto}.topnav-link{height:38px;display:flex;align-items:center;padding:0 13px;border-radius:10px;color:#707482;text-decoration:none;font-size:13px;font-weight:760;white-space:nowrap}.topnav-link.active{background:#eef1ff;color:var(--brand)}.topbar-tools{margin-left:auto;display:flex;gap:8px}.topbar-action{height:38px;border:1px solid var(--border);border-radius:11px;background:#fff;padding:0 13px;color:#565b69;font-weight:760}.studio-grid{display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);gap:22px;max-width:1540px;height:calc(100vh - 68px);margin:auto;padding:22px 24px 20px}.creation-pane{display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.creation-scroll{flex:1;min-height:0;overflow:auto;padding:18px}.creation-footer{padding:12px 18px 18px;border-top:1px solid var(--border)}.pane-heading h1{font-size:22px;margin:0 0 14px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px}.switch{padding:4px;display:flex;gap:5px;flex-wrap:wrap;background:#f5f6fa}.switch button{flex:1;min-width:140px;border:0;border-radius:10px;padding:10px;background:transparent;color:#656b78;font-weight:800}.switch button.active{background:#fff;color:var(--brand);box-shadow:0 3px 12px rgba(35,40,60,.08)}.form{padding:14px;margin-top:10px}.form label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:11px 0 5px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px}.form textarea{min-height:90px}.drop{border:2px dashed var(--border);border-radius:11px;padding:15px;text-align:center;color:var(--muted);background:#fafbfe}.drop .fn{font-weight:800;color:#5f6e8e;word-break:break-all}.primary{position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:850}.primary span{position:relative;z-index:2}.video-wave{position:absolute;z-index:1;left:-10%;bottom:-2px;width:120%;height:130%;background:#536cff;transform:translateY(108%);transition:transform 25s cubic-bezier(.16,.72,.23,1)}.video-wave::before{content:"";position:absolute;left:50%;top:-18px;width:180%;height:38px;border-radius:43%;transform:translateX(-50%);background:rgba(255,255,255,.3);animation:wave 7s linear infinite}.primary.is-loading .video-wave{transform:translateY(5%)}@keyframes wave{to{transform:translateX(-50%) rotate(360deg)}}.status{font-size:12px;color:#677080;margin-top:8px}.preview-pane{display:flex;flex-direction:column;gap:12px;min-width:0}.preview-header{display:flex;justify-content:space-between;align-items:center}.preview-header h2{margin:0;font-size:18px}.preview-stage{position:relative;flex:1;min-height:620px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,#fbfbfd,#f0f2f7);overflow:auto;padding:16px;box-shadow:var(--shadow)}.preview-empty{position:absolute;inset:72px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a1a5af;pointer-events:none}.preview-empty.hidden{display:none}.preview-empty strong{color:#676c78;font-size:16px;margin:8px 0 6px}.preview-empty span{font-size:12px}.empty-icon{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:#e9ebf2;color:#9da2af;font-size:28px}.config-loading,.config-error{width:100%;padding:14px;border-radius:10px;background:#f5f6fa;color:#737987;font-size:12px;line-height:1.6}.config-error{border:1px solid #ead9d5;background:#fff9f7;color:#815d55}.config-error b,.config-error span{display:block}.config-error button{min-height:44px;margin-top:10px;border:1px solid #d9c0b9;border-radius:9px;background:#fff;padding:0 16px;color:#754f46;font-weight:800}.task-panel-head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}.task-card,.job{border:1px solid var(--border);border-radius:12px;background:#fff;margin:10px 0;padding:12px}.task-spin{width:30px;height:30px;border:4px solid #dbe1f0;border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}.task-spin.done{border-color:#7db69f;animation:none}.task-spin.err{border-color:#d58c80;animation:none}@keyframes spin{to{transform:rotate(360deg)}}.task-info{display:inline-block;margin-left:10px}.task-time{float:right;font-weight:850}.task-result img,.task-result video,.result img,.result video,.job img{width:100%;max-height:640px;object-fit:contain;border-radius:10px;background:#111}.dl{display:block;width:100%;border:0;text-align:center;margin-top:7px;padding:9px;border-radius:9px;background:#f0f2f8;color:#5d6474;font-weight:750;text-decoration:none}.library-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(25,28,38,.28);padding:74px 20px 20px}.library-overlay.open{display:flex;justify-content:flex-end}.library-panel{width:min(460px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:20px}.library-header{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--border)}.library-header h2{margin:0}.library-scroll{flex:1;min-height:0;overflow:auto;padding:0 18px 18px}.close{width:36px;height:36px;border:0;border-radius:10px}.note,.task-meta{font-size:11px;color:var(--muted)}
@media(max-width:820px){body{height:auto;overflow:auto}.app-shell{height:auto}.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 12px}.topnav{order:3;width:100%}.topbar-tools{margin-left:auto}.topbar-action{min-width:44px;min-height:44px}.studio-grid{grid-template-columns:1fr;height:auto;padding:12px}.creation-scroll{overflow:visible;padding:14px 14px 80px}.creation-footer{position:sticky;bottom:0;background:#fff;z-index:5}.preview-stage{min-height:430px}.library-overlay{padding:62px 8px 8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.primary.is-loading .video-wave{transform:translateY(18%)}}
</style></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="/promptgen"><span class="brand-mark">JT</span><span>JT 灵感工作台</span></a><nav class="topnav"><a class="topnav-link" href="/promptgen">创作台</a><a class="topnav-link" href="/original-sketch">原始铅绘</a><a class="topnav-link" href="/original-graphic">原始古风</a><a class="topnav-link active" href="/video">视频</a></nav><div class="topbar-tools"><button class="topbar-action" id="favOpen">♥ 收藏</button><button class="topbar-action" id="histOpen">⌛ 历史</button></div></header><main class="studio-grid"><aside class="creation-pane"><div class="creation-scroll"><div class="pane-heading"><h1>视频创作</h1></div><section class="panel switch" id="wfSwitch"><div class="config-loading">正在加载视频工作流…</div></section><section class="panel form" id="wfForm"><div class="config-loading">加载完成后可设置提示词和素材</div></section></div><div class="creation-footer"><button class="primary" id="genBtn" disabled><span class="video-wave"></span><span>生成视频</span></button><div class="status" id="genStatus"></div></div></aside><section class="preview-pane"><div class="preview-header"><h2>视频预览</h2></div><div class="preview-stage"><div class="preview-empty" id="videoEmpty"><div class="empty-icon">▶</div><strong>生成后，视频将在这里播放</strong><span>任务状态、预览和下载会显示在同一区域</span></div><section class="panel" id="taskPanel"><div class="task-panel-head"><b>视频任务</b><span class="note" id="taskCount">0 个任务</span></div><div id="taskList"></div></section><div class="result" id="genResult"></div></div></section></main><div class="library-overlay" id="histOverlay"><div class="library-panel"><div class="library-header"><h2>历史记录</h2><button class="close">×</button></div><div class="library-scroll"><div id="histList"></div></div></div></div><div class="library-overlay" id="favOverlay"><div class="library-panel"><div class="library-header"><h2>我的收藏</h2><button class="close">×</button></div><div class="library-scroll"><div id="favList"></div></div></div></div></div><script>const api=async(path,opt={})=>{const r=await fetch(path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d};
let WFS=[],cur=null,mediaFiles={},genRunning=false;
async function init(){const box=document.getElementById('wfSwitch'),form=document.getElementById('wfForm'),btn=document.getElementById('genBtn');box.innerHTML='<div class="config-loading">正在加载视频工作流…</div>';form.innerHTML='<div class="config-loading">加载完成后可设置提示词和素材</div>';btn.disabled=true;try{const a=await api('/api/workflows');WFS=a.filter(w=>w.kind==='video');if(!WFS.length)throw new Error('没有可用的视频工作流');box.innerHTML='';WFS.forEach(w=>{const b=document.createElement('button');b.dataset.wf=w.id;b.innerHTML='<b>'+w.name+'</b>';b.onclick=()=>{cur=w;renderForm();renderSwitch()};box.appendChild(b)});cur=WFS[0];renderForm();renderSwitch();btn.disabled=false}catch(e){cur=null;box.innerHTML='<div class="config-error"><b>视频配置加载失败</b><span>'+e.message+'</span><button type="button" onclick="retryWorkflows()">重新加载</button></div>';form.innerHTML='<div class="config-error"><span>请确认服务连接后重试，现有任务和素材不会被提交。</span></div>'}}function retryWorkflows(){init()}
function renderSwitch(){document.querySelectorAll('#wfSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.wf===cur.id))}
function isVideoType(t){return t==='video'}
function renderForm(){const f=document.getElementById('wfForm');f.innerHTML='<div class="note"><b>'+cur.name+'</b><br>'+cur.desc+'</div>';
  const media=Object.entries(cur.rh_media||{});
  media.forEach(([key,m])=>{const lab=document.createElement('label');lab.textContent=m.label+(m.required?'（必传）':'（可选）');f.appendChild(lab);
    const drop=document.createElement('div');drop.className='drop';drop.innerHTML='<span>点击选择或拖入文件</span><div class="fn"></div>';drop.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept=isVideoType(m.type)?'video/*':'image/*';inp.onchange=()=>{if(inp.files[0])uploadMedia(key,m,inp.files[0],drop)};inp.click()};
    f.appendChild(drop)});
  const params=Object.entries(cur.rh_params||{});
  params.forEach(([key,p])=>{if(key==='prompt'||key==='negative'){const lab=document.createElement('label');lab.textContent=p.label+(key==='prompt'?'（必填）':'');f.appendChild(lab);const ta=document.createElement('textarea');ta.id='param_'+key;if(cur.prompt_placeholder&&key==='prompt')ta.placeholder=cur.prompt_placeholder;if(key==='prompt'&&cur.prompt_hint){const h=document.createElement('div');h.className='note';h.style.color='#c26a4a';h.textContent=cur.prompt_hint;f.appendChild(h)}f.appendChild(ta);return}
    const lab=document.createElement('label');lab.textContent=p.label;f.appendChild(lab);
    if(p.type==='number'){const inp=document.createElement('input');inp.type='number';inp.id='param_'+key;const d=(cur.params_defaults||{})[key];if(d!==undefined)inp.value=d;f.appendChild(inp)}
    else{const inp=document.createElement('input');inp.type='text';inp.id='param_'+key;const d=(cur.params_defaults||{})[key];if(d!==undefined)inp.value=d;f.appendChild(inp)}})}
async function uploadMedia(key,m,file,drop){const fnEl=drop.querySelector('.fn');fnEl.textContent='上传中…';try{const buf=await file.arrayBuffer();const b64=await blobToB64(new Blob([buf]));const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,data:b64})});mediaFiles[key]=r.fileName;fnEl.textContent='✓ '+file.name+' → '+r.fileName.slice(0,24)+'…';drop.style.borderColor='#8fbf9f'}catch(e){fnEl.textContent='✗ 上传失败：'+e.message;mediaFiles[key]=undefined}}
function blobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
function collectParams(){const p={};Object.keys(cur.rh_params||{}).forEach(k=>{const el=document.getElementById('param_'+k);if(el&&el.value!=='')p[k]=el.value});return p}
function addResult(j,container){videoEmpty.classList.add('hidden');container.innerHTML='';(j.images||[]).forEach((im,i)=>{const w=document.createElement('div');w.className='job';const isVid=/\.(mp4|mov|webm|avi|mkv)(\?|$)/i.test(im.url);w.innerHTML='<div class="note">种子：'+(j.seed??j.sequence_seed??'未知')+' · '+im.file+'</div>'+(isVid?'<video src="'+im.url+'" controls></video>':'<img src="'+(im.preview_url||im.url)+'">')+'<button class="dl fav">♥ 收藏此结果</button><a class="dl" target="_blank" href="'+im.url+'">⬇ 下载原文件</a>';w.querySelector('.fav').onclick=async e=>{e.target.disabled=true;e.target.textContent='收藏中…';try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:j.id,image_index:i})});e.target.textContent='✓ 已收藏'}catch(x){e.target.disabled=false;e.target.textContent='收藏失败：'+x.message}};container.appendChild(w)})}
const tasks=new Map(); // job_id -> {card, timeEl, metaEl, spinEl, timer, startTs, wfName}
function fmtTime(s){s=Math.floor(s);const m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return m+':'+ss}
function refreshTaskCount(){const n=tasks.size;document.getElementById('taskCount').textContent=n+' 个任务（最多3个并发）'}
function taskStatusText(j){const s=j.provider_status||j.status;if(j.status==='done')return '✓ 完成';if(j.status==='error')return '✗ 失败';if(s==='SUBMITTING')return '排队中…';if(s==='RUNNING')return '生成中…';return s||'处理中…'}
function taskStatusClass(j){if(j.status==='done')return 'done';if(j.status==='error')return 'err';return ''}
function addTaskCard(jobId,wfName){if(tasks.has(jobId))return;videoEmpty.classList.add('hidden');const list=document.getElementById('taskList');const card=document.createElement('div');card.className='task-card';card.innerHTML='<div class="task-spin"></div><div class="task-info"><div class="task-name">'+wfName+'</div><div class="task-meta" id="meta_'+jobId+'">排队中…</div></div><div class="task-time" id="time_'+jobId+'">00:00</div><div class="task-result" id="res_'+jobId+'"></div>';list.prepend(card);const t={card,timeEl:card.querySelector('#time_'+jobId),metaEl:card.querySelector('#meta_'+jobId),spinEl:card.querySelector('.task-spin'),resEl:card.querySelector('#res_'+jobId),timer:null,startTs:Date.now(),wfName};tasks.set(jobId,t);t.timer=setInterval(()=>{t.timeEl.textContent=fmtTime((Date.now()-t.startTs)/1000)},500);refreshTaskCount()}
function removeTaskCard(jobId){const t=tasks.get(jobId);if(!t)return;if(t.timer)clearInterval(t.timer);t.card.remove();tasks.delete(jobId);refreshTaskCount()}
function renderTaskResult(j,resEl){resEl.innerHTML='';(j.images||[]).forEach((im,i)=>{const isVid=/\.(mp4|mov|webm|avi|mkv)(\?|$)/i.test(im.url);const w=document.createElement('div');w.innerHTML=(isVid?'<video src="'+im.url+'" controls></video>':'<img src="'+(im.preview_url||im.url)+'">')+'<a class="dl" target="_blank" href="'+im.url+'">⬇ 下载原文件</a>';resEl.appendChild(w)})}
function pollTask(jobId){const t=tasks.get(jobId);if(!t)return;api('/api/job/'+jobId).then(j=>{if(!tasks.has(jobId))return;t.metaEl.textContent=taskStatusText(j);t.spinEl.className='task-spin '+taskStatusClass(j);if(j.status==='done'){if(t.timer){clearInterval(t.timer);t.timer=null}t.timeEl.textContent=fmtTime(j.elapsed||0);renderTaskResult(j,t.resEl);if(j.images&&j.images.length){const im=j.images[0];const fav=document.createElement('button');fav.className='dl';fav.textContent='♥ 收藏此结果';fav.onclick=async e=>{e.target.disabled=true;e.target.textContent='收藏中…';try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId,image_index:0})});e.target.textContent='✓ 已收藏'}catch(x){e.target.disabled=false;e.target.textContent='收藏失败：'+x.message}};t.resEl.appendChild(fav)}}else if(j.status==='error'){if(t.timer){clearInterval(t.timer);t.timer=null}t.timeEl.textContent='—';t.metaEl.textContent='✗ '+(j.error||'生成失败');setTimeout(()=>removeTaskCard(jobId),8000)}else{setTimeout(()=>pollTask(jobId),5000)}}).catch(()=>{setTimeout(()=>pollTask(jobId),8000)})}
async function generate(){if(genRunning)return;if(!cur)return;genRunning=true;const btn=document.getElementById('genBtn');btn.disabled=true;btn.classList.add('is-loading');const st=document.getElementById('genStatus');st.textContent='正在提交…';document.getElementById('genResult').innerHTML='';try{const prompt=(document.getElementById('param_prompt')?.value||'').trim();if(!prompt)throw new Error('提示词不能为空');const required=Object.entries(cur.rh_media||{}).filter(([,m])=>m.required).map(([k])=>k);const missing=required.filter(k=>!mediaFiles[k]);if(missing.length)throw new Error('缺少必传素材：'+missing.join(', '));const body={workflow:cur.id,prompt:prompt,negative_prompt:(document.getElementById('param_negative')?.value||'').trim(),media:mediaFiles,params:collectParams()};const r=await api('/api/video-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.job_id)throw new Error(r.error||'提交失败');addTaskCard(r.job_id,cur.name);st.textContent='✓ 已提交，任务 '+r.job_id+' 在下方队列中';pollTask(r.job_id)}catch(e){st.textContent='✗ '+e.message}finally{genRunning=false;btn.classList.remove('is-loading');btn.disabled=false}}
async function history(){const l=document.getElementById('histList');l.innerHTML='加载中…';const a=await api('/api/jobs');l.innerHTML='';a.filter(j=>j.workflow&&WFS.find(w=>w.id===j.workflow)).slice(0,10).forEach(j=>{const w=WFS.find(x=>x.id===j.workflow);const d=document.createElement('div');d.className='job';d.innerHTML='<b>'+(w?w.name:'视频')+'</b><div class="note">'+j.status+' · '+(j.elapsed||'')+'秒</div><button class="dl">查看结果</button>';d.querySelector('button').onclick=()=>addResult(j,d);l.appendChild(d)})}
async function favorites(){const l=document.getElementById('favList');l.innerHTML='加载中…';const a=await api('/api/favorites');l.innerHTML='';a.forEach(f=>{const d=document.createElement('div');d.className='job';d.innerHTML='<div class="note">'+(f.prompt||'').slice(0,120)+'</div><img src="'+(f.preview_url||f.image_url)+'"><a class="dl" href="'+f.image_url+'" target="_blank">⬇ 下载</a>';l.appendChild(d)})}
document.getElementById('genBtn').onclick=generate;document.getElementById('histOpen').onclick=()=>{histOverlay.querySelector('.library-scroll').scrollTop=0;histOverlay.classList.add('open');history()};document.getElementById('favOpen').onclick=()=>{favOverlay.querySelector('.library-scroll').scrollTop=0;favOverlay.classList.add('open');favorites()};document.querySelectorAll('.library-overlay .close').forEach(b=>b.onclick=()=>b.closest('.library-overlay').classList.remove('open'));init();</script></body></html>
