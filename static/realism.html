/* Shared workbench material. Edge highlights approximate thickness, not optical refraction. */
:root {
  --app-background-image:radial-gradient(ellipse at 12% 12%,#e1e7f8 0%,transparent 48%),radial-gradient(ellipse at 92% 86%,#dfeee9 0%,transparent 46%);
  --app-background-size:cover;
  --app-background-position:center;
  --app-background-opacity:1;
  --app-background-veil:rgba(246,247,251,.28);
  --text:#20222a;
  --muted:#626a79;
  --border:rgba(68,80,112,.16);
  --success:#237760;
  --danger:#a23c3c;
  --warning:#8b551f;
  --focus-ring:#4057d9;
  --glass-tint:rgba(255,255,255,.76);
  --glass-chrome:rgba(255,255,255,.82);
  --glass-dialog:rgba(255,255,255,.94);
  --glass-blur:18px;
  --glass-saturation:125%;
  --glass-edge:rgba(255,255,255,.92);
  --glass-edge-shade:rgba(63,78,113,.14);
  --glass-shadow:0 10px 30px rgba(31,43,75,.08);
  --surface:#fff;
  --surface-soft:rgba(247,249,253,.94);
  --soft:var(--surface-soft);
  --field-surface:rgba(255,255,255,.96);
  --selected-surface:#edf0ff;
  --radius-shell:22px;
  --radius-panel:14px;
  --radius-control:10px;
}
body {background:transparent;isolation:isolate;color:var(--text)}
.app-background {position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--canvas);overflow:hidden}
.app-background::before,.app-background::after {content:"";position:absolute;inset:0;pointer-events:none}
.app-background::before {background-image:var(--app-background-image);background-size:var(--app-background-size);background-position:var(--app-background-position);background-repeat:no-repeat;opacity:var(--app-background-opacity)}
.app-background::after {background:var(--app-background-veil)}
.app-shell {background:transparent}
.topbar,.creation-pane,.preview-stage,.library-panel,.api-popover,.api-settings-popover,.api-drawer {
  background:var(--surface);
  border-color:var(--border);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 var(--glass-edge-shade);
}
.creation-pane,.preview-stage,.library-panel {position:relative;border-radius:var(--radius-shell)}
.topbar {position:relative;z-index:70}

  .topbar,.creation-pane,.preview-stage,.library-panel,.api-popover,.api-settings-popover,.api-drawer {
    background:var(--glass-tint);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));
    backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturation));
  }
  .topbar {background:var(--glass-chrome)}
  .library-panel,.api-popover,.api-settings-popover,.api-drawer {background:var(--glass-dialog)}
}
/* Only the thin perimeter moves; text, hit targets, blur and large surfaces remain still. */
@supports ((mask-composite:exclude) or (-webkit-mask-composite:xor)) {
  .creation-pane::after,.preview-stage::after,.library-panel::after,.api-popover::after,.api-settings-popover::after {
    content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,255,255,.28) 35%,rgba(80,108,159,.18) 65%,rgba(255,255,255,.72));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    transition:transform 220ms ease,opacity 220ms ease;
  }

function renderNumberControl(key,mapping,state){const box=controlShell(key,mapping),control=document.createElement('input');control.type='number';if(mapping.min!==undefined)control.min=mapping.min;if(mapping.max!==undefined)control.max=mapping.max;if(mapping.step!==undefined)control.step=mapping.step;else control.step=mapping.type==='int'?'1':'any';control.value=state.params[key]??'';control.oninput=()=>state.params[key]=readControlValue({type:mapping.type,mapping,control});box.appendChild(control);controlRefs.set(key,{type:mapping.type,mapping,control,box});return box}
function readControlValue(ref){if(ref.type==='image')return undefined;if(ref.type==='boolean')return ref.control.checked;if(ref.type==='int')return ref.control.value;if(ref.type==='float'||ref.type==='number')return ref.control.value===''?'':Number(ref.control.value);return ref.control.value}
function groupFor(key,mapping){if(mapping.group==='advanced'||mapping.group==='output')return'advanced';if(mapping.group==='common')return'common';return /seed|step|cfg|denoise|strength|scale|upscale|output|route|branch|mode/i.test(key)?'advanced':'common'}
function renderControl(key,mapping,state,version){const type=String(mapping.type||'text').toLowerCase();if(type==='image')return renderImageControl(key,mapping,state,version);if(['text','string','textarea'].includes(type))return renderTextControl(key,mapping,state);if(['boolean','bool','switch'].includes(type))return renderBooleanControl(key,mapping,state);if(['select','enum','combo'].includes(type))return renderSelectControl(key,mapping,state);if(['int','integer','float','number'].includes(type)){const normalized={...mapping,type:type==='integer'?'int':type};return renderNumberControl(key,normalized,state)}const unsupported=controlShell(key,mapping);unsupported.append('该控件类型暂不支持：'+type);return unsupported}

function renderSubworkflows(){subworkflowPanel.replaceChildren();if(current.subworkflows?.length){const title=document.createElement('div');title.className='field-label';title.textContent='3in1子功能';const box=document.createElement('div');box.className='config-stack';current.subworkflows.forEach(item=>{const row=document.createElement('button');row.type='button';row.className='config-drawer-head';row.disabled=!item.available;row.textContent=item.label+(item.available?' · 当前可用':' · 暂不可用：'+item.reason);box.appendChild(row)});subworkflowPanel.append(title,box)}if(current.fixed_features?.length){const fixed=document.createElement('div');fixed.className='workflow-note';fixed.textContent=current.fixed_features.join('；');subworkflowPanel.appendChild(fixed)}}
function renderForm(){renderVersion++;controlRefs.clear();renderSubworkflows();const version=renderVersion,state=ensureState(current);operateControls.innerHTML='';commonControls.innerHTML='';advancedControls.innerHTML='';Object.entries(current.rh_media||{}).forEach(([key,mapping])=>{const target=isCoreOperateControl(mapping)?operateControls:commonControls;target.appendChild(renderControl(key,mapping,state,version))});Object.entries(current.rh_params||{}).forEach(([key,mapping])=>{let target;if(isCoreOperateControl(mapping))target=operateControls;else target=groupFor(key,mapping)==='advanced'?advancedControls:commonControls;target.appendChild(renderControl(key,mapping,state,version))});if(!operateControls.children.length)operateControls.innerHTML='<div class="config-state">此方案无需上传素材</div>';if(!commonControls.children.length)commonControls.innerHTML='<div class="config-state">此方案没有额外常用设置</div>';if(!advancedControls.children.length)advancedControls.innerHTML='<div class="config-state">此方案没有额外高级设置</div>';workflowNote.textContent=current.desc||'';updateDependencies();updateGenerateAvailability()}

function blobToB64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)})}

function statusText(job){const phase=job.provider_status||job.status;if(job.status==='done')return'✓ 已完成';if(job.status==='error')return'✗ '+(job.error||'失败');if(phase==='SUBMITTING')return'正在提交';if(phase==='QUEUED')return'排队中';if(phase==='RUNNING')return'运行中';if(phase==='FINALIZING')return'正在整理结果';return phase||'处理中'}

function createTaskCard(jobId,name){const card=document.createElement('article'),head=document.createElement('div'),spin=document.createElement('div'),info=document.createElement('div'),title=document.createElement('div'),meta=document.createElement('div'),timeEl=document.createElement('div'),view=document.createElement('button');card.className='task-card';card.dataset.jobId=jobId;head.className='task-head';spin.className='task-spin';title.className='task-name';title.textContent=String(name);meta.className='task-meta';meta.textContent='任务号：'+jobId+' · 等待状态';timeEl.className='task-time';timeEl.textContent='00:00';view.className='task-view';view.textContent='查看结果';view.hidden=true;info.append(title,meta);head.append(spin,info,timeEl,view);card.append(head);return{card,spin,meta,time:timeEl,view}}
function addTaskCard(jobId,name='真人化工作流'){if(tasks.has(jobId))return tasks.get(jobId);previewEmpty.classList.add('hidden');const parts=createTaskCard(jobId,name);taskList.prepend(parts.card);const task={...parts,started:Date.now(),timer:null};task.timer=setInterval(()=>task.time.textContent=fmtTime((Date.now()-task.started)/1000),500);tasks.set(jobId,task);taskCount.textContent=tasks.size+'个任务';return task}
function safeRemoteUrl(value){const raw=String(value??'');if(/[\x00-\x20\x7f"'<>`]/.test(raw))return'';try{const url=new URL(raw,location.origin);return ['http:','https:'].includes(url.protocol)&&!url.username&&!url.password?url.href:''}catch{return''}}
function isPreviewableImage(image,url){const kind=String(image.file_type||image.fileType||image.outputType||image.output_type||image.type||'').toLowerCase();if(kind.startsWith('image/')||['png','jpg','jpeg','webp','gif','avif'].includes(kind))return true;try{return /\.(png|jpe?g|webp|gif|avif)$/i.test(new URL(url).pathname)}catch{return false}}
function createResultItem(job,image,index){const item=document.createElement('div');item.className='job';const preview=safeRemoteUrl(image.preview_url||image.url),original=safeRemoteUrl(image.url),canPreview=isPreviewableImage(image,preview||original);const actions=document.createElement('div');actions.className='result-actions';const download=document.createElement('a');download.className='dl';download.target='_blank';download.rel='noopener';download.textContent=canPreview?'⬇ 下载原图':'⬇ 下载结果文件';if(original)download.href=original;else{download.removeAttribute('href');download.textContent='结果链接无效'};if(canPreview){const picture=document.createElement('img');picture.loading='lazy';picture.decoding='async';picture.alt='真人化结果';image.src=preview||original;picture.src=image.src;const favorite=document.createElement('button');favorite.className='dl favorite';favorite.textContent='♥ 收藏结果与全部参数';favorite.onclick=async event=>{event.target.disabled=true;try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:job.id,image_index:index})});event.target.textContent='✓ 已收藏'}catch(error){event.target.disabled=false;event.target.textContent='收藏失败：'+error.message}};actions.append(favorite,download);item.append(picture,actions)}else{const file=document.createElement('div');file.className='file-result';file.textContent='结果文件 · 请下载查看';actions.append(download);item.append(file,actions)}return item}
const realismGalleryItems=[];let realismGalleryIndex=-1;
function renderRealismGallery(){if(realismGalleryIndex<0||!realismGalleryItems.length)return;const entry=realismGalleryItems[realismGalleryIndex],job=entry.job,image=entry.image,index=entry.index,preview=safeRemoteUrl(image.preview_url||image.url),original=safeRemoteUrl(image.url),canPreview=isPreviewableImage(image,preview||original);galleryMain.replaceChildren();galleryThumbs.replaceChildren();const meta=document.createElement('div');meta.className='gallery-meta note';meta.textContent=(image.stage_label||('结果 '+(realismGalleryIndex+1)))+' · '+String(job.wf_name||job.workflow||'真人化');galleryMain.appendChild(meta);if(canPreview){const picture=document.createElement('img');picture.src=preview||original;picture.alt='真人化结果';galleryMain.appendChild(picture)}else{const file=document.createElement('div');file.className='file-result';file.textContent='结果文件 · 请下载查看';galleryMain.appendChild(file)}const actions=document.createElement('div'),download=document.createElement('a'),favorite=document.createElement('button');actions.className='gallery-actions';download.className='dl';download.target='_blank';download.rel='noopener';download.href=original;download.textContent=canPreview?'⬇ 下载原图':'⬇ 下载结果文件';favorite.className='dl';favorite.textContent='♥ 收藏结果与全部参数';favorite.disabled=!canPreview;favorite.onclick=async()=>{favorite.disabled=true;try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:job.id,image_index:index})});favorite.textContent='✓ 已收藏'}catch(error){favorite.disabled=false;favorite.textContent='收藏失败：'+error.message}};actions.append(favorite,download);galleryMain.appendChild(actions);realismGalleryItems.forEach((item,i)=>{const button=document.createElement('button');button.type='button';button.className='gallery-thumb'+(i===realismGalleryIndex?' active':'');button.onclick=()=>{realismGalleryIndex=i;renderRealismGallery()};if(isPreviewableImage(item.image,item.image.preview_url||item.image.url)){const thum function renderResults(job){(job.images||[]).forEach((image,index)=>{const key=job.id+':'+index;if(!realismGalleryItems.some(item=>item.key===key))realismGalleryItems.push({key,job,image,index})});if(realismGalleryItems.length){realismGalleryIndex=realismGalleryItems.length-1;renderRealismGallery()}}
async function pollTask(jobId,name){const task=addTaskCard(jobId,name);let failures=0;while(tasks.has(jobId)){try{const job=await api('/api/job/'+jobId);failures=0;task.meta.textContent='任务号：'+jobId+' · '+statusText(job)+' · '+coinText(job);if(job.status==='done'||job.status==='error'){if(task.timer)clearInterval(task.timer);task.timer=null;task.time.textContent=fmtTime(job.elapsed||0);task.spin.className='task-spin '+(job.status==='done'?'done':'err');forgetActiveJob(jobId);if(job.status==='done'){renderResults(job);task.view.hidden=false;task.view.onclick=()=>renderResults(job)};return job}}catch(error){failures++;task.meta.textContent='任务号：'+jobId+' · 状态连接中断，重试 '+failures+'/6';if(failures>=6){if(task.timer)clearInterval(task.timer);task.spin.className='task-spin err';task.meta.textContent='任务号：'+jobId+' · 暂时无法获取状态，刷新可恢复';return}}await new Promise(resolve=>setTimeout(resolve,failures?3000:1800))}}
async function submitWorkflow(){if(!current||generateBtn.disabled)return;const snapshot=snapshotSelections(),state=ensureState(current);generateBtn.disabled=true;generateBtn.setAttribute('aria-busy','true');generateStatus.textContent='正在提交…';let pending={};try{pending=JSON.parse(localStorage.getItem(pendingSubmitKey)||'{}')}catch{}let client_request_id=pending.workflow===current.id&&pending.id?pending.id:'realism-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem(pendingSubmitKey,JSON.stringify({workflow:current.id,id:client_request_id}));const body={workflow:current.id,media:state.media,params:state.params,client_request_id,selection_snapshot:snapshot};const submitPath=current.kind==='ai_app'?'/api/ai-app-generate':'/api/workflow-generate';try{const response=await api(submitPath,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});localStorage.removeItem(pendingSubmitKey);rememberActiveJob(response.job_id);addTaskCard(response.job_id,current.name);generateStatus.textContent=(response.deduplicated?'已恢复':'已提交')+'，任务号：'+response.job_id;pollTask(response.job_id,current.name)}catch(error){const definitiveRejection=error.status>=400&&error.status<500;if(definitiveRejection)localStorage.removeItem(pendingSubmitKey);const running=error.data?.running_job||error.data?.running_jobs?.join('、');generateStatus.textContent='提交失败：'+error.message+(running?'；正在运行任务号：'+running:'')+(definitiveRejection?'':'；再次点击将使用同一请求号恢复')}finally{generateBtn.setAttribute('aria-busy','false');updateGenerateAvailability()}}
async function restoreTasks(){await Promise.all(getActiveIds().map(async id=>{try{const job=await api('/api/job/'+id);const name=job.wf_name||job.workflow||'真人化工作流';addTaskCard(id,name);if(job.status==='done'||job.status==='error'){forgetActiveJob(id);const task=tasks.get(id);if(task.timer)clearInterval(task.timer);task.timer=null;task.time.textContent=fmtTime(job.elapsed||0);task.spin.className='task-spin '+(job.status==='done'?'done':'err');task.meta.textContent='任务号：'+id+' · '+statusText(job)+' · '+coinText(job);if(job.status==='done'){renderResults(job);task.view.hidden=false;task.view.onclick=()=>renderResults(job)}}else pollTask(id,name)}catch{forgetActiveJob(id)}}))}

const CREATOR_ROUTES=['/','/realism','/video'];function scheduleRoutePrefetch(){const connection=navigator.connection||{};if(connection.saveData||/2g/.test(connection.effectiveType||''))return;const loaded=new Set(),load=href=>{if(!CREATOR_ROUTES.includes(href)||href===location.pathname||loaded.has(href))return;loaded.add(href);const link=document.createElement('link');link.rel='prefetch';link.as='document';link.href=href;document.head.appendChild(link)};document.querySelectorAll('.topnav-link').forEach(a=>{const href=a.getAttribute('href');a.addEventListener('pointerenter',()=>load(href),{once:true});a.addEventListener('focus',()=>load(href),{once:true})});const idle=()=>CREATOR_ROUTES.filter(x=>x!==location.pathname).slice(0,2).forEach(load);'requestIdleCallback'in window?requestIdleCallback(idle,{timeout:2500}):setTimeout(idle,1800)}
document.querySelectorAll('.config-drawer-head').forEach(button=>button.onclick=()=>button.closest('.config-drawer').classList.toggle('open'));workflowSelect.onchange=()=>selectWorkflow(workflowSelect.value);generateBtn.onclick=submitWorkflow;galleryPrev.onclick=()=>{if(realismGalleryItems.length){realismGalleryIndex=(realismGalleryIndex-1+realismGalleryItems.length)%realismGalleryItems.length;renderRealismGallery()}};galleryNext.onclick=()=>{if(realismGalleryItems.length){realismGalleryIndex=(realismGalleryIndex+1)%realismGalleryItems.length;renderRealismGallery()}};addEventListener('resize',ensureActiveNavVisible);ensureActiveNavVisible();histOpen.onclick=()=>{histOverlay.querySelector('.library-scroll').scrollTop=0;histOverlay.classList.add('open');history()};favOpen.onclick=()=>{favOverlay.querySelector('.library-scroll').scrollTop=0;favOverlay.classList.add('open');favorites()};document.querySelectorAll('.library-overlay .close').forEach(button=>button.onclick=()=>button.closest('.library-overlay').classList.remove('open'));document.querySelectorAll('.library-overlay').forEach(overlay=>overlay.onclick=event=>{if(event.target===overlay)overlay.classList.remove('open')});scheduleRoutePrefetch();(window.requestIdleCallback||function(fn){setTimeout(fn,200)})(preloadWorkflowPreviews);loadWorkflows().then(restoreTasks);
