-items:center;justify-content:space-between;min-height:44px;padding:0 4px}.bool-row input{width:44px;height:24px;accent-color:var(--brand)}.upload-box{position:relative;min-height:112px;display:flex;align-items:center;justify-content:center;padding:12px;border:2px dashed #d9deeb;border-radius:11px;background:#fff;color:#7f8592;text-align:center;cursor:pointer}.upload-box.has-file{border-style:solid;border-color:#cfd6f1}.upload-box input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.upload-status{margin-top:6px;color:var(--muted);font-size:10px;word-break:break-all}.upload-status.ok{color:var(--success)}.upload-status.err{color:var(--danger)}.config-state{padding:13px;border-radius:11px;background:#f5f6fa;color:#737987;font-size:12px;line-height:1.55}.config-state.error{border:1px solid #ead9d5;background:#fff9f7;color:#815d55}.retry{min-height:44px;margin-top:9px;border:1px solid #d9c0b9;border-radius:9px;background:#fff;padding:0 15px;color:#754f46;font-weight:800}.primary{width:100%;min-height:52px;border:1px solid #aeb9ff;border-radius:12px;background:var(--brand);color:#fff;font-weight:850;cursor:pointer}.primary:disabled{opacity:.58;cursor:not-allowed}.status{min-height:18px;margin-top:8px;color:#687080;font-size:11px;line-height:1.5;word-break:break-word}.preview-pane{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}.preview-header{display:flex;align-items:center;justify-content:space-between}.preview-header h2{margin:0;font-size:18px}.note,.task-meta{color:var(--muted);font-size:11px}.preview-stage{position:relative;flex:1;min-height:620px;overflow-y:auto;overflow-x:hidden;padding:16px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,#fbfbfd,#f0f2f7);box-shadow:var(--shadow)}.preview-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a1a5af;pointer-events:none}.preview-empty.hidden{display:none}.empt <div class="app-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">JT</span><span>JT 灵感工作台</span></a><nav class="topnav"><a class="topnav-link" href="/">创作台</a><a class="topnav-link" href="/original-sketch">原始铅绘</a><a class="topnav-link" href="/original-graphic">原始古风</a><a class="topnav-link" href="/realcomic">漫画转真人</a><a class="topnav-link active" href="/realism">真人化工作流</a><a class="topnav-link" href="/video">视频</a></nav><div class="topbar-tools"><button class="topbar-action" id="favOpen">♥ 收藏</button><button class="topbar-action" id="histOpen">⌛ 历史</button></div></header>
<main class="studio-grid"><aside class="creation-pane"><div class="creation-scroll"><div class="pane-heading"><span class="eyebrow">REALISM WORKFLOWS</span><h1>真人化工作流</h1><p>按工作流原始输入动态展示；未配置真实 ID 的工作流不会出现。</p></div><label class="field-label" for="workflowSelect">选择工作流</label><select class="workflow-select" id="workflowSelect" disabled><option>正在加载…</option></select><div class="workflow-note" id="workflowNote">正在读取可信工作流配置</div>

<script>
const api=async(path,opt={})=>{const response=await fetch(path,opt);let data={};try{data=await response.json()}catch{}if(!response.ok){const error=new Error(data.error||('HTTP '+response.status));error.data=data;throw error}return data};
const ACTIVE_KEY='jt-active-realism-jobs',SOURCE_PAGE='realism';let workflows=[],current=null,renderVersion=0;const stateByWorkflow=new Map(),controlRefs=new Map();const tasks=new Map();
function getActiveIds(){try{return JSON.parse(sessionStorage.getItem(ACTIVE_KEY)||'[]').filter(Boolean)}catch{return[]}}function setActiveIds(ids){sessionStorage.setItem(ACTIVE_KEY,JSON.stringify([...new Set(ids)]))}function rememberActiveJob(id){setActiveIds([...getActiveIds(),id])}function forgetActiveJob(id){setActiveIds(getActiveIds().filter(item=>item!==id))}
function fmtTime(seconds){seconds=Math.max(0,Math.floor(seconds));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function optionValue(option){return typeof option==='object'?String(option.value??option.index??option.name??''):String(option)}function optionLabel(option){return typeof option==='object'?String(option.label??option.name??option.value??option.index??''):String(option)}
function ensureState(workflow){if(!stateByWorkflow.has(workflow.id)){const params={},media={};Object.entries(workflow.rh_params||{}).forEach(([key,mapping])=>{if(Object.prototype.hasOwnProperty.call(mapping,'default'))params[key]=mapping.default;else if(Object.prototype.hasOwnProperty.call(workflow.params_defaults||{},key))params[key]=workflow.params_defaults[key];else if(mapping.type==='boolean')params[key]=false;else params[key]=''});stateByWorkflow.set(workflow.id,{params,media,mediaNames:{}})}return stateByWorkflow.get(workflow.id)}
function controlShell(key,mapping){const box=document.createElement('article');box.className='control';box.dataset.controlKey=key;const title=document.createElement('div'),caption=document.createElement('span');title.className='control-head';caption.className='control-title';caption.textContent=String(mapping.label||key);if(mapping.required){const required=document.createElement('span');required.className='required';required.textContent=' *';caption.appendChild(required)}title.appendChild(caption);box.appendChild(title);if(mapping.description||mapping.help){const help=document.createElement('div');help.className='control-help';help.textContent=String(mapping.description||mapping.help);box.appendChild(help)}return box}
function renderImageControl(key,mapping,state,version){const box=controlShell(key,mapping);const label=document.createElement('label'),copy=document.createElement('span'),line=document.createElement('br'),hint=document.createElement('small'),input=document.createElement('input'),status=document.createElement('div');label.className='upload-box';label.tabIndex=0;label.setAttribute('role','button');copy.textContent='点击上传 '+String(mapping.label||'图片');hint.textContent='PNG / JPEG / WebP，最大30MB';input.type='file';input.accept='image/png,image/jpeg,image/webp';copy.append(line,hint);label.append(copy,input);status.className='upload-status';status.textContent=state.mediaNames[key]?(state.mediaNames[key]+' 已上传'):'尚未上传';if(state.media[key]){label.classList.add('has-file');status.classList.add('ok')}label.onclick=event=>{if(event.target!==input)input.click()};label.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();input.click()}};input.onchange=async()=>{const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){status.textContent='只支持PNG、JPEG或WebP';status.className='upload-status err';return}if(file.size>30*1024*1024){status.textContent='图片超过30MB';status.className='upload-status err';return}status.textContent='上传中…';status.className='upload-status';generateBtn.disabled=true;try{const data=await blobToB64(file),result=await api('/api/workflow-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflow:current.id,input_key:key,filename:file.name,data})});if(version!==renderVersion)return;state.media[key]=result.fileName;state.mediaNames[key]=file.name;label.classList.add('has-file');status.textContent='✓ '+file.name+' 已上传';status.className='upload-status ok'}catch(error){delete state.media[key];status.textContent='上传失败：'+error.message;status.className='upload-status err'}finally{updateGenerateAvailability()}};box.append(label,status);controlRefs.set(key,{type:'image',mapping,control:input});return box}
function renderTextControl(key,mapping,state){const box=controlShell(key,mapping),control=document.createElement('textarea');control.value=String(state.params[key]??'');control.placeholder=String(mapping.placeholder||'');control.maxLength=Number(mapping.max_length||10000);control.oninput=()=>state.params[key]=control.value;box.appendChild(control);controlRefs.set(key,{type:'text',mapping,control});return box}
function renderBooleanControl(key,mapping,state){const box=controlShell(key,mapping),row=document.createElement('label'),control=document.createElement('input');row.className='bool-row';row.append(document.createTextNode('关闭 / 开启'),control);control.type='checkbox';control.checked=state.params[key]===true;control.onchange=()=>state.params[key]=control.checked;box.appendChild(row);controlRefs.set(key,{type:'boolean',mapping,control});return box}
function renderSelectControl(key,mapping,state){const box=controlShell(key,mapping),control=document.createElement('select');(mapping.options||[]).forEach(option=>{const item=document.createElement('option');item.value=optionValue(option);item.textContent=optionLabel(option);control.appendChild(item)});control.value=String(state.params[key]??optionValue((mapping.options||[])[0]||''));control.onchange=()=>state.params[key]=control.value;box.appendChild(control);controlRefs.set(key,{type:'select',mapping,control});return box}
function renderNumberControl(key,mapping,state){const box=controlShell(key,mapping),control=document.createElement('input');control.type='number';if(mapping.min!==undefined)control.min=mapping.min;if(mapping.max!==undefined)control.max=mapping.max;if(mapping.step!==undefined)control.step=mapping.step;else control.step=mapping.type==='int'?'1':'any';control.value=state.params[key]??'';control.oninput=()=>state.params[key]=readControlValue({type:mapping.type,mapping,control});box.appendChild(control);controlRefs.set(key,{type:mapping.type,mapping,control});return box}
function readControlValue(ref){if(ref.type==='image')return undefined;if(ref.type==='boolean')return ref.control.checked;if(ref.type==='int')return ref.control.value;if(ref.type==='float'||ref.type==='number')return ref.control.value===''?'':Number(ref.control.value);return ref.control.value}
function groupFor(key,mapping){if(mapping.group==='advanced'||mapping.group==='output')return'advanced';if(mapping.group==='common')return'common';return /seed|step|cfg|denoise|strength|scale|upscale|output|route|branch|mode/i.test(key)?'advanced':'common'}
function renderControl(key,mapping,state,version){const type=String(mapping.type||'text').toLowerCase();if(type==='image')return renderImageControl(key,mapping,state,version);if(['text','string','textarea'].includes(type))return renderTextControl(key,mapping,state);if(['boolean','bool','switch'].includes(type))return renderBooleanControl(key,mapping,state);if(['select','enum','combo'].includes(type))return renderSelectControl(key,mapping,state);if(['int','integer','float','number'].includes(type)){const normalized={...mapping,type:type==='integer'?'int':type};return renderNumberControl(key,normalized,state)}const unsupported=controlShell(key,mapping);unsupported.append('该控件类型暂不支持：'+type);return unsupported}
function isCoreOperateControl(mapping){const type=String(mapping.type||'text').toLowerCase();return mapping.required&&(type==='image'||['text','string','textarea'].includes(type))}
function renderForm(){renderVersion++;controlRefs.clear();const version=renderVersion,state=ensureState(current);operateControls.innerHTML='';commonControls.innerHTML='';advancedControls.innerHTML='';Object.entries(current.rh_media||{}).forEach(([key,mapping])=>{const target=isCoreOperateControl(mapping)?operateControls:commonControls;target.appendChild(renderControl(key,mapping,state,version))});Object.entries(current.rh_params||{}).forEach(([key,mapping])=>{let target;if(isCoreOperateControl(mapping))target=operateControls;else target=groupFor(key,mapping)==='advanced'?advancedControls:commonControls;target.appendChild(renderControl(key,mapping,state,version))});if(!operateControls.children.length)operateControls.innerHTML='<div class="config-state">此工作流没有必传素材或核心文本</div>';if(!commonControls.children.length)commonControls.innerHTML='<div class="config-state">此工作流没有额外常用设置</div>';if(!advancedControls.children.length)advancedControls.innerHTML='<div class="config-state">此工作流没有额外高级输入</div>';workflowNote.textContent=current.desc||'';updateGenerateAvailability()}
function updateGenerateAvailability(){if(!current){generateBtn.disabled=true;generateBtn.textContent='没有可用工作流';return}const state=ensureState(current),missing=Object.entries(current.rh_media||{}).filter(([key,mapping])=>mapping.required&&!state.media[key]).map(([,mapping])=>mapping.label);generateBtn.disabled=missing.length>0;generateBtn.textContent=missing.length?'请先上传：'+missing.join('、'):'开始运行 '+current.name}
function selectWorkflow(id){current=workflows.find(item=>item.id===id)||workflows[0]||null;if(!current)return updateGenerateAvailability();workflowSelect.value=current.id;renderForm()}
function showWorkflowLoadError(error){const box=document.createElement('div'),retry=document.createElement('button');box.className='config-state error';box.textContent='工作流配置加载失败：'+error.message;retry.className='retry';retry.type='button';retry.textContent='重新加载';retry.onclick=loadWorkflows;box.appendChild(document.createElement('br'));box.appendChild(retry);commonControls.replaceChildren(box);const empty=document.createElement('div');empty.className='config-state';empty.textContent='没有提交任何任务';advancedControls.replaceChildren(empty)}
async function loadWorkflows(){workflowSelect.disabled=true;workflowSelect.innerHTML='<option>正在加载…</option>';generateBtn.disabled=true;try{const all=await api('/api/workflows');workflows=all.filter(item=>item.backend==='runninghub'||['rh_workflow','ai_app'].includes(item.kind)).filter(item=>['rh_workflow','ai_app'].includes(item.kind));if(!workflows.length)throw new Error('配置中没有可用的真人化工作流');workflowSelect.innerHTML='';workflows.forEach(workflow=>{const option=document.createElement('option');option.value=workflow.id;option.textContent=workflow.name;workflowSelect.appendChild(option)});workflowSelect.disabled=false;selectWorkflow(workflows[0].id)}catch(error){current=null;workflowSelect.innerHTML='<option>加载失败</option>';showWorkflowLoadError(error);generateStatus.textContent='请检查服务后重试';updateGenerateAvailability()}}
function blobToB64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)})}
function snapshotSelections(){const state=ensureState(current);controlRefs.forEach((ref,key)=>{if(ref.type!=='image')state.params[key]=readControlValue(ref)});return{source_page:SOURCE_PAGE,workflow:current.id,params:JSON.parse(JSON.stringify(state.params)),media:JSON.parse(JSON.stringify(state.media)),media_names:JSON.parse(JSON.stringify(state.mediaNames))}}
function applySnapshot(snapshot){if(!snapshot||snapshot.source_page!==SOURCE_PAGE)return;const workflow=workflows.find(item=>item.id===snapshot.workflow);if(!workflow)return;stateByWorkflow.set(workflow.id,{params:JSON.parse(JSON.stringify(snapshot.params||{})),media:JSON.parse(JSON.stringify(snapshot.media||{})),mediaNames:JSON.parse(JSON.stringify(snapshot.media_names||{}))});selectWorkflow(workflow.id);commonDrawer.classList.add('open');advancedDrawer.classList.add('open');favOverlay.classList.remove('open')}
function statusText(job){const phase=job.provider_status||job.status;if(job.status==='done')return'✓ 已完成';if(job.status==='error')return'✗ '+(job.error||'失败');if(phase==='SUBMITTING')return'正在提交';if(phase==='QUEUED')return'排队中';if(phase==='RUNNING')return'运行中';if(phase==='FINALIZING')return'正在整理结果';return phase||'处理中'}
function createTaskCard(jobId,name){const card=document.createElement('article'),head=document.createElement('div'),spin=document.createElement('div'),info=document.createElement('div'),title=document.createElement('div'),meta=document.createElement('div'),timeEl=document.createElement('div'),result=document.createElement('div');card.className='task-card';card.dataset.jobId=jobId;head.className='task-head';spin.className='task-spin';title.className='task-name';title.textContent=String(name);meta.className='task-meta';meta.textContent='任务号：'+jobId+' · 等待状态';timeEl.className='task-time';timeEl.textContent='00:00';result.className='task-result';info.append(title,meta);head.append(spin,info,timeEl);card.append(head,result);return{card,spin,meta,time:timeEl,result}}
function addTaskCard(jobId,name='真人化工作流'){if(tasks.has(jobId))return tasks.get(jobId);previewEmpty.classList.add('hidden');const parts=createTaskCard(jobId,name);taskList.prepend(parts.card);const task={...parts,started:Date.now(),timer:null};task.timer=setInterval(()=>task.time.textContent=fmtTime((Date.now()-task.started)/1000),500);tasks.set(jobId,task);taskCount.textContent=tasks.size+'个任务';return task}
function safeRemoteUrl(value){const raw=String(value??'');if(/[\x00-\x20\x7f"'<>`]/.test(raw))return'';try{const url=new URL(raw,location.origin);return ['http:','https:'].includes(url.protocol)&&!url.username&&!url.password?url.href:''}catch{return''}}
function createResultItem(job,image,index){const item=document.createElement('div');item.className='job';const preview=safeRemoteUrl(image.preview_url||image.url),original=safeRemoteUrl(image.url);const picture=document.createElement('img');picture.loading='lazy';picture.decoding='async';picture.alt='真人化结果';image.src=preview||original;picture.src=image.src;const actions=document.createElement('div');actions.className='result-actions';const favorite=document.createElement('button');favorite.className='dl favorite';favorite.textContent='♥ 收藏结果与全部参数';const download=document.createElement('a');download.className='dl';download.target='_blank';download.rel='noopener';download.textContent='⬇ 下载原图';if(original)download.href=original;else{download.removeAttribute('href');download.textContent='结果链接无效'};actions.append(favorite,download);item.append(picture,actions);favorite.onclick=async event=>{event.target.disabled=true;try{await api('/api/favorites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:job.id,image_index:index})});event.target.textContent='✓ 已收藏'}catch(error){event.target.disabled=false;event.target.textContent='收藏失败：'+error.message}};return item}
function renderResults(job,container){container.innerHTML='';(job.images||[]).forEach((image,index)=>container.appendChild(createResultItem(job,image,index)))}
async function pollTask(jobId,name){const task=addTaskCard(jobId,name);let failures=0;while(tasks.has(jobId)){try{const job=await api('/api/job/'+jobId);failures=0;task.meta.textContent='任务号：'+jobId+' · '+statusText(job);if(job.status==='done'||job.status==='error'){if(task.timer)clearInterval(task.timer);task.timer=null;task.time.textContent=fmtTime(job.elapsed||0);task.spin.className='task-spin '+(job.status==='done'?'done':'err');forgetActiveJob(jobId);if(job.status==='done')renderResults(job,task.result);return job}}catch(error){failures++;task.meta.textContent='任务号：'+jobId+' · 状态连接中断，重试 '+failures+'/6';if(failures>=6){if(task.timer)clearInterval(task.timer);task.spin.className='task-spin err';task.meta.textContent='任务号：'+jobId+' · 暂时无法获取状态，刷新可恢复';return}}await new Promise(resolve=>setTimeout(resolve,failures?3000:1800))}}
async function submitWorkflow(){if(!current||generateBtn.disabled)return;const snapshot=snapshotSelections(),state=ensureState(current);generateBtn.disabled=true;generateBtn.setAttribute('aria-busy','true');generateStatus.textContent='正在提交…';const client_request_id='realism-'+Date.now()+'-'+Math.random().toString(36).slice(2);const body={workflow:current.id,media:state.media,params:state.params,client_request_id,selection_snapshot:snapshot};try{const response=await api('/api/workflow-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});rememberActiveJob(response.job_id);addTaskCard(response.job_id,current.name);generateStatus.textContent=(response.deduplicated?'已恢复':'已提交')+'，任务号：'+response.job_id;pollTask(response.job_id,current.name)}catch(error){const running=error.data?.running_job||error.data?.running_jobs?.join('、');generateStatus.textContent='提交失败：'+error.message+(running?'；正在运行任务号：'+running:'')}finally{generateBtn.setAttribute('aria-busy','false');updateGenerateAvailability()}}
async function restoreTasks(){await Promise.all(getActiveIds().map(async id=>{try{const job=await api('/api/job/'+id);const name=job.wf_name||job.workflow||'真人化工作流';addTaskCard(id,name);if(job.status==='done'||job.status==='error'){forgetActiveJob(id);const task=tasks.get(id);if(task.timer)clearInterval(task.timer);task.timer=null;task.time.textContent=fmtTime(job.elapsed||0);task.spin.className='task-spin '+(job.status==='done'?'done':'err');task.meta.textContent='任务号：'+id+' · '+statusText(job);if(job.status==='done')renderResults(job,task.result)}else pollTask(id,name)}catch{forgetActiveJob(id)}}))}
function createHistoryItem(job){const card=document.createElement('div'),title=document.createElement('b'),note=document.createElement('div'),button=document.createElement('button');card.className='job';title.textContent=String(job.wf_name||job.workflow||'真人化工作流');note.className='note';note.textContent=statusText(job)+' · 任务号：'+String(job.id||'未知')+' · '+String(job.elapsed??'—')+'秒';button.className='dl';button.textContent='查看结果';button.onclick=()=>renderResults(job,card);card.append(title,note,button);return card}
async function history(){histList.textContent='加载中…';try{const ids=new Set(workflows.map(item=>item.id)),items=(await api('/api/jobs')).filter(job=>ids.has(job.workflow)||job.style_id==='realism');histList.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='job note';empty.textContent='暂无真人化历史';histList.appendChild(empty)}else items.forEach(job=>histList.appendChild(createHistoryItem(job)))}catch(error){const failed=document.createElement('div');failed.className='job';failed.textContent='历史加载失败：'+error.message;histList.replaceChildren(failed)}}
function createFavoriteItem(item){const card=document.createElement('div'),note=document.createElement('div'),image=document.createElement('img'),apply=document.createElement('button'),download=document.createElement('a');card.className='job';note.className='note';note.textContent=String(item.selection_snapshot?.workflow||'真人化工作流');image.loading='lazy';image.decoding='async';image.alt='收藏的真人化结果';image.src=safeRemoteUrl(item.preview_url||item.image_url);apply.className='dl apply';apply.textContent='↺ 套用全部参数';apply.onclick=()=>applySnapshot(item.selection_snapshot);download.className='dl';download.target='_blank';download.rel='noopener';const original=safeRemoteUrl(item.image_url);download.textContent=original?'⬇ 下载收藏原图':'收藏链接无效';if(original)download.href=original;card.append(note,image,apply,download);return card}
async function favorites(){favList.textContent='加载中…';try{const items=(await api('/api/favorites')).filter(item=>item.selection_snapshot?.source_page===SOURCE_PAGE);favList.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='job note';empty.textContent='暂无真人化收藏';favList.appendChild(empty)}else items.forEach(item=>favList.appendChild(createFavoriteItem(item)))}catch(error){const failed=document.createElement('div');failed.className='job';failed.textContent='收藏加载失败：'+error.message;favList.replaceChildren(failed)}}
function ensureActiveNavVisible(){const nav=document.querySelector('.topnav'),active=nav?.querySelector('.active');if(!nav||!active)return;const left=active.offsetLeft-Math.max(0,(nav.clientWidth-active.offsetWidth)/2);nav.scrollLeft=Math.max(0,left)}
document.querySelectorAll('.config-drawer-head').forEach(button=>button.onclick=()=>button.closest('.config-drawer').classList.toggle('open'));workflowSelect.onchange=()=>selectWorkflow(workflowSelect.value);generateBtn.onclick=submitWorkflow;addEventListener('resize',ensureActiveNavVisible);ensureActiveNavVisible();histOpen.onclick=()=>{histOverlay.querySelector('.library-scroll').scrollTop=0;histOverlay.classList.add('open');history()};favOpen.onclick=()=>{favOverlay.querySelector('.library-scroll').scrollTop=0;favOverlay.classList.add('open');favorites()};document.querySelectorAll('.library-overlay .close').forEach(button=>button.onclick=()=>button.closest('.library-overlay').classList.remove('open'));document.querySelectorAll('.library-overlay').forEach(overlay=>overlay.onclick=event=>{if(event.target===overlay)overlay.classList.remove('open')});loadWorkflows().then(restoreTasks);
</script></body></html>
