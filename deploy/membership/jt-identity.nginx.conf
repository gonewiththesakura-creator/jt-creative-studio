# Additive dedicated host. Never merge this into the existing dreamapi.club site.
limit_req_zone $binary_remote_addr zone=jt_identity_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jt_identity_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=jt_identity_conn:10m;
log_format jt_identity_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name auth.dreamapi.club;
    location ^~ /.well-known/acme-challenge/ { root /var/www/jt-identity-acme; }
    location / { return 308 https://auth.dreamapi.club$request_uri; }
}

server {
    listen 443 ssl;
    server_name auth.dreamapi.club;
    ssl_certificate /etc/letsencrypt/live/auth.dreamapi.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.dreamapi.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn jt_identity_conn 20;
    access_log /var/log/nginx/jt-identity-access.log jt_identity_safe;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_cookie_flags casdoor_session_id secure httponly samesite=lax;
    location ~ ^/(?:swagger|docs|metrics|debug)(?:/|$) { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/api/(?:login|signup|set-password|reset-password|send-verification-code)$ {
        limit_req zone=jt_identity_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host auth.dreamapi.club;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        limit_req zone=jt_identity_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host auth.dreamapi.club;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
