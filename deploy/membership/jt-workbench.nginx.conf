# Install only after authenticated JT routes and data migration have passed.
# This is a NEW host. The existing dreamapi.club/API site remains untouched.
limit_req_zone $binary_remote_addr zone=jt_workbench_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=jt_workbench_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=jt_workbench_conn:10m;
log_format jt_workbench_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name studio.dreamapi.club;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://studio.dreamapi.club$request_uri; }
}
server {
    listen 443 ssl;
    server_name studio.dreamapi.club;
    ssl_certificate /etc/letsencrypt/live/studio.dreamapi.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.dreamapi.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 256m;
    client_body_timeout 120s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn jt_workbench_conn 30;
    access_log /var/log/nginx/jt-workbench-access.log jt_workbench_safe;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /api/admin/release-drain { return 404; }
    location ~ ^/(?:tools|sources|panel_data|audit|\.git|\.env)(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~ ^/api/(?:auth/(?:login|code-login)|membership/redeem)$ {
        limit_req zone=jt_workbench_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8189;
        proxy_set_header Host studio.dreamapi.club;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        limit_req zone=jt_workbench_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_set_header Host studio.dreamapi.club;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
